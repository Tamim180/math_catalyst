<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Math Catalyst — Courses</title>
<meta name="theme-color" content="#050814" />
<!-- Font: Plus Jakarta Sans (phone falls back to its system font if it cannot load) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   SHARED DESIGN LANGUAGE (same block on every page)
   Change colours / rounding / spacing here to retheme the site.
============================================================ */
:root{
  --bg:#050814; --surface:rgba(13,20,42,.78); --surface-2:rgba(21,31,60,.82);
  --line:rgba(148,163,184,.16); --line-cyan:rgba(34,211,238,.30);
  --text:#f1f5f9; --text-2:#b4c0d3; --text-3:#8a99b0;
  --cyan:#22d3ee; --cyan-deep:#0891b2; --gold:#f59e0b; --gold-soft:#fbbf24;
  --green:#34d399; --violet:#818cf8; --pink:#ff6ba0; --red:#f87171;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --container:1120px; --gutter:20px; --nav-h:64px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text-2);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;z-index:0}   /* particle background drawn by the page script */
a{color:inherit;text-decoration:none} button{font-family:inherit} img{max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ---- top bar ---- */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--nav-h);
  padding:8px max(var(--gutter),calc((100vw - var(--container))/2 + var(--gutter)));
  background:rgba(5,8,20,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-logo img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(34,211,238,.35))}
.nav-logo-text,.logo-text{line-height:1.05}
.nav-logo-text .the,.logo-text .the{display:block;font-size:9px;font-weight:600;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.nav-logo-text .main,.logo-text .main{display:block;font-size:16px;font-weight:800;letter-spacing:.06em;color:#fff}
.nav-logo-text .cat,.logo-text .cat,.logo-text .catalyst{display:block;font-size:10px;font-weight:600;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-btn,.nav-back{min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s}
.nav-btn:hover,.nav-back:hover{border-color:var(--line-cyan);background:rgba(34,211,238,.08);color:var(--cyan)}

/* ---- primary buttons ---- */
.btn,.btn-primary,.enroll-btn,.save-btn,.submit-btn,.gate-btn,.mobile-enroll,.browse-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border:0;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#031018;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 22px rgba(34,211,238,.22);transition:transform .2s,box-shadow .2s}
.btn:hover,.btn-primary:hover,.enroll-btn:hover,.save-btn:hover,.submit-btn:hover,.gate-btn:hover,.mobile-enroll:hover,.browse-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(34,211,238,.35)}
.enroll-btn.owned{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.3);box-shadow:none;cursor:default}
.enroll-btn.owned:hover{transform:none}

/* ---- form fields ---- */
.field,.m-field{margin-bottom:var(--s4)}
.field label,.m-field label{display:block;margin-bottom:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.field input,.field select,.field textarea,.m-field input,.m-field select,.m-field textarea,.gate-input,.search-box,.price-input{
  width:100%;min-height:46px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,34,.9);
  color:var(--text);font:inherit;font-size:16px;outline:none;resize:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder,.field textarea::placeholder,.m-field input::placeholder,.m-field textarea::placeholder,.gate-input::placeholder{color:var(--text-3);opacity:.6}
.field input:focus,.field select:focus,.field textarea:focus,.m-field input:focus,.m-field select:focus,.m-field textarea:focus,.gate-input:focus,.search-box:focus,.price-input:focus{border-color:var(--line-cyan);box-shadow:0 0 0 3px rgba(34,211,238,.10)}
.field select option,.m-field select option{background:#0a1024}

/* ---- cards ---- */
.section-card,.profile-card,.sidebar-card,.summary-card,.chapter,.course-card,.stat-card,.table-wrap,.course-admin-card,.enrolled-course,.gate-card,.success-box{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}

/* ---- pop-up window ---- */
.modal-overlay{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(6px)}
.modal-overlay.open{display:flex}
.modal-box{width:100%;max-width:500px;max-height:100%;overflow:hidden;border-radius:var(--r-lg);background:#0a1024;border:1px solid var(--line-cyan);box-shadow:0 0 80px rgba(34,211,238,.10)}
.modal-close{flex-shrink:0;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text-2);font-size:15px;cursor:pointer;transition:.2s}
.modal-close:hover{background:rgba(34,211,238,.12);color:#fff}

@media(max-width:640px){:root{--gutter:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ COURSES PAGE ============ */
main{position:relative;z-index:2;max-width:var(--container);margin:0 auto;padding:var(--s7) var(--gutter) var(--s8)}
.nav-user{font-size:14px;color:var(--text-2)} .nav-user span{color:var(--cyan);font-weight:600}
.page-header{margin-bottom:var(--s6)}
.page-header h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em;color:var(--text);margin-bottom:6px}
.page-header h1 span{color:var(--cyan)}
.page-header p{font-size:16px}
.filter-row{display:flex;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s6)}
.filter-btn{min-height:40px;padding:0 20px;border-radius:var(--r-pill);border:1px solid var(--line);background:transparent;color:var(--text-2);font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.filter-btn:hover{border-color:var(--line-cyan);color:var(--text)}
.filter-btn.active{background:rgba(34,211,238,.12);border-color:var(--line-cyan);color:var(--cyan)}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:var(--s4)}
.course-card{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.course-card:hover{transform:translateY(-4px);border-color:var(--line-cyan);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.card-thumb{position:relative;height:130px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-thumb svg{position:absolute;inset:0;width:100%;height:100%}
.card-thumb svg text{opacity:.3} .card-thumb svg circle{stroke-opacity:.4}
.card-thumb::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 90%);mask-image:linear-gradient(180deg,#000,transparent 90%)}
.thumb-label{position:relative;z-index:1;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.18)}
.card-body{display:flex;flex-direction:column;flex:1;padding:18px 20px 20px}
.card-tag{align-self:flex-start;margin-bottom:var(--s3);padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.tag-secondary{background:rgba(129,140,248,.12);color:var(--violet);border:1px solid rgba(129,140,248,.25)}
.tag-hsc{background:rgba(245,158,11,.10);color:var(--gold);border:1px solid rgba(245,158,11,.25)}
.tag-ssc{background:rgba(34,211,238,.08);color:var(--cyan);border:1px solid rgba(34,211,238,.22)}
.card-title{margin-bottom:6px;font-size:18px;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:var(--text)}
.card-desc{margin-bottom:var(--s4);font-size:14px;line-height:1.65}
.card-meta{display:flex;gap:var(--s4);margin-bottom:var(--s4)}
.meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-3)}
.meta-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);opacity:.6}
.card-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-top:var(--s4);border-top:1px solid var(--line)}
.price{font-size:20px;font-weight:800;color:var(--gold)}
.price .currency{margin-right:1px;font-size:14px;font-weight:600}
.price .tbd{font-size:14px;font-weight:600;color:var(--text-3)}
.enroll-btn{min-height:40px;padding:0 18px;font-size:14px}
.empty{grid-column:1/-1;padding:60px 0;text-align:center;color:var(--text-3)}
@media(max-width:640px){.nav-user{display:none} main{padding-top:var(--s6)}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="index.html">
    <img src="logo.png" alt="logo" />
    <div class="nav-logo-text">
      <div class="the">The</div>
      <div class="main">MATH</div>
      <div class="cat">Catalyst</div>
    </div>
  </a>
  <div class="nav-right">
    <div class="nav-user">Hi, <span id="nav-name">Student</span></div>
    <button class="nav-btn" onclick="location.href='login.html'">Sign out</button>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>All <span>Courses</span></h1>
    <p>Buy once, keep forever. Pick the course that matches your class.</p>
  </div>

  <div class="filter-row" id="filter-row"></div>
  <div class="course-grid" id="course-grid"></div>
</main>

<script>
/* ============================================================
   COURSES DATA — edit this array to add / remove / change courses
   Fields:
     title      — course name shown on card
     tag        — label shown as badge  
     tagClass   — CSS class for badge color: tag-ssc | tag-hsc | tag-secondary
     desc       — short description
     chapters   — number of chapters
     videos     — total video count
     price      — number (taka), or null for "TBD"
     accentFrom — gradient start color for thumbnail
     accentTo   — gradient end color for thumbnail
     owned      — true if student already bought it (will come from backend later)
============================================================ */
const courses = [
  {
    title: "Class 9 Math",
    tag: "SSC",
    tagClass: "tag-ssc",
    desc: "Full syllabus coverage for Class 9. Algebra, geometry, trigonometry and more.",
    chapters: 12,
    videos: 48,
    price: null,
    accentFrom: "#0a2a3a",
    accentTo: "#050814",
    owned: false
  },
  {
    title: "Class 10 Math",
    tag: "SSC",
    tagClass: "tag-ssc",
    desc: "Complete Class 10 math preparation. Focused on board exam patterns.",
    chapters: 14,
    videos: 56,
    price: null,
    accentFrom: "#0a2a3a",
    accentTo: "#050814",
    owned: false
  },
  {
    title: "HSC 1st Year Math",
    tag: "HSC",
    tagClass: "tag-hsc",
    desc: "Higher math for HSC 1st year. Calculus, vectors, complex numbers.",
    chapters: 10,
    videos: 42,
    price: null,
    accentFrom: "#2a1a05",
    accentTo: "#050814",
    owned: false
  },
  {
    title: "HSC 2nd Year Math",
    tag: "HSC",
    tagClass: "tag-hsc",
    desc: "Final year HSC math. Statistics, mechanics, and full board preparation.",
    chapters: 11,
    videos: 46,
    price: null,
    accentFrom: "#2a1a05",
    accentTo: "#050814",
    owned: false
  }
];

/* ── filters derived from data ── */
const allTags = ['All', ...new Set(courses.map(c => c.tag))];
let activeFilter = 'All';

function renderFilters() {
  const row = document.getElementById('filter-row');
  row.innerHTML = allTags.map(tag => `
    <button class="filter-btn ${tag === activeFilter ? 'active' : ''}"
      onclick="setFilter('${tag}')">${tag}</button>
  `).join('');
}

function setFilter(tag) {
  activeFilter = tag;
  renderFilters();
  renderCourses();
}

function renderCourses() {
  const filtered = activeFilter === 'All' ? courses : courses.filter(c => c.tag === activeFilter);
  const grid = document.getElementById('course-grid');

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">No courses found.</div>';
    return;
  }

  grid.innerHTML = filtered.map((c, i) => `
    <div class="course-card" onclick="openCourse(${courses.indexOf(c)})">
      <div class="card-thumb" style="background: linear-gradient(135deg, ${c.accentFrom}, ${c.accentTo})">
        <svg viewBox="0 0 300 130" xmlns="http://www.w3.org/2000/svg">
          ${thumbSVG(c)}
        </svg>
        <span class="thumb-label">${c.tag}</span>
      </div>
      <div class="card-body">
        <span class="card-tag ${c.tagClass}">${c.tag}</span>
        <div class="card-title">${c.title}</div>
        <div class="card-desc">${c.desc}</div>
        <div class="card-meta">
          <div class="meta-item"><div class="meta-dot"></div>${c.chapters} chapters</div>
          <div class="meta-item"><div class="meta-dot"></div>${c.videos} videos</div>
        </div>
        <div class="card-footer">
          <div class="price">
            ${c.price ? `<span class="currency">৳</span>${c.price}` : '<span class="tbd">Price TBD</span>'}
          </div>
          <button class="enroll-btn ${c.owned ? 'owned' : ''}" onclick="event.stopPropagation(); enrollClick(${courses.indexOf(c)})">
            ${c.owned ? '✓ Enrolled' : 'Enroll now'}
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

function thumbSVG(c) {
  const isHSC = c.tag === 'HSC';
  const col = isHSC ? '#f59e0b' : '#22d3ee';
  const formulas = isHSC
    ? ['∫f(x)dx', 'lim x→∞', 'd/dx', 'Σaₙ']
    : ['ax²+bx', 'sin θ', '√x²+y²', 'log n'];
  return `
    <circle cx="150" cy="65" r="50" fill="none" stroke="${col}" stroke-width="0.4" stroke-opacity="0.2" stroke-dasharray="4 6"/>
    <circle cx="150" cy="65" r="30" fill="none" stroke="${col}" stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="3 5"/>
    <text x="150" y="72" text-anchor="middle" font-size="28" font-weight="900" fill="${col}" opacity="0.18" font-family="monospace">${isHSC ? '∫' : 'x²'}</text>
    ${formulas.map((f, i) => {
      const angles = [30, 140, 210, 320];
      const rad = angles[i] * Math.PI / 180;
      const r = 46;
      const fx = 150 + r * Math.cos(rad);
      const fy = 65 + r * Math.sin(rad);
      return `<text x="${fx}" y="${fy}" text-anchor="middle" font-size="9" fill="${col}" opacity="0.35" font-family="monospace">${f}</text>`;
    }).join('')}
  `;
}

function openCourse(idx) {
  // will navigate to course page — placeholder for now
  alert(`Opening: ${courses[idx].title}\n(Course detail page coming next!)`);
}

function enrollClick(idx) {
  if (courses[idx].owned) return;
  // will navigate to purchase page
  alert(`Enroll in: ${courses[idx].title}\n(Purchase page coming next!)`);
}

renderFilters();
renderCourses();

/* ── ambient particle background (same system as login) ── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

let mouse = { x: w / 2, y: h / 2 };
let ripples = [];
let t = 0;

// mouse
document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
document.addEventListener('click', e => {
  for (let i = 0; i < 3; i++) ripples.push({ x: e.clientX, y: e.clientY, r: i * 15, speed: 1.8 + i * 0.4 });
});
// touch
document.addEventListener('touchmove', e => {
  const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: true });
document.addEventListener('touchstart', e => {
  const touch = e.touches[0]; mouse.x = touch.clientX; mouse.y = touch.clientY;
  for (let i = 0; i < 3; i++) ripples.push({ x: touch.clientX, y: touch.clientY, r: i * 15, speed: 1.8 + i * 0.4 });
}, { passive: true });

function draw() {
  ctx.fillStyle = 'rgba(5, 8, 20, 0.13)';
  ctx.fillRect(0, 0, w, h);
  t += 0.003;
  const step = 28;
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const dx = x - mouse.x, dy = y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const wave = Math.sin(dist * 0.018 - t * 5);
      const influence = Math.max(0, 1 - dist / 380);
      let ox = Math.sin(t + y * 0.009) * 7;
      let oy = Math.cos(t + x * 0.009) * 7;
      for (const r of ripples) {
        const rx = x - r.x, ry = y - r.y;
        const d = Math.sqrt(rx*rx + ry*ry);
        const rWave = Math.sin(d * 0.045 - r.r * 0.18);
        const rForce = Math.max(0, 1 - d / 280);
        ox += rWave * rForce * 10; oy += rWave * rForce * 10;
      }
      const cx_ratio = x / w;
      const r_val = Math.round(34 + cx_ratio * (245 - 34));
      const g_val = Math.round(211 + cx_ratio * (158 - 211));
      const b_val = Math.round(238 + cx_ratio * (11 - 238));
      const alpha = 0.03 + wave * 0.04 + influence * 0.12;
      ctx.fillStyle = `rgba(${r_val},${g_val},${b_val},${alpha})`;
      ctx.fillRect(x + ox + wave * 9, y + oy + wave * 9, 2, 2);
    }
  }
  ripples.forEach(r => r.r += r.speed);
  ripples = ripples.filter(r => r.r < 140);
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
