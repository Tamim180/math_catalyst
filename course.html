<title>The Math Catalyst — Course</title>

<!-- Font: Plus Jakarta Sans (phone falls back to its system font if it cannot load) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
/* ============================================================
   SHARED DESIGN LANGUAGE (same block on every page)
   Change colours / rounding / spacing here to retheme the site.
============================================================ */
:root{
  --bg:#050814; --surface:rgba(13,20,42,.78); --surface-2:rgba(21,31,60,.82);
  --line:rgba(148,163,184,.16); --line-cyan:rgba(34,211,238,.30);
  --text:#f1f5f9; --text-2:#b4c0d3; --text-3:#8a99b0;
  --cyan:#22d3ee; --cyan-deep:#0891b2; --gold:#f59e0b; --gold-soft:#fbbf24;
  --green:#34d399; --violet:#818cf8; --pink:#ff6ba0; --red:#f87171;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --container:1120px; --gutter:20px; --nav-h:64px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text-2);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;z-index:0}   /* particle background drawn by the page script */
a{color:inherit;text-decoration:none} button{font-family:inherit} img{max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ---- top bar ---- */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--nav-h);
  padding:8px max(var(--gutter),calc((100vw - var(--container))/2 + var(--gutter)));
  background:rgba(5,8,20,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-logo img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(34,211,238,.35))}
.nav-logo-text,.logo-text{line-height:1.05}
.nav-logo-text .the,.logo-text .the{display:block;font-size:9px;font-weight:600;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.nav-logo-text .main,.logo-text .main{display:block;font-size:16px;font-weight:800;letter-spacing:.06em;color:#fff}
.nav-logo-text .cat,.logo-text .cat,.logo-text .catalyst{display:block;font-size:10px;font-weight:600;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-btn,.nav-back{min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s}
.nav-btn:hover,.nav-back:hover{border-color:var(--line-cyan);background:rgba(34,211,238,.08);color:var(--cyan)}

/* ---- primary buttons ---- */
.btn,.btn-primary,.enroll-btn,.save-btn,.submit-btn,.gate-btn,.mobile-enroll,.browse-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border:0;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#031018;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 22px rgba(34,211,238,.22);transition:transform .2s,box-shadow .2s}
.btn:hover,.btn-primary:hover,.enroll-btn:hover,.save-btn:hover,.submit-btn:hover,.gate-btn:hover,.mobile-enroll:hover,.browse-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(34,211,238,.35)}
.enroll-btn.owned{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.3);box-shadow:none;cursor:default}
.enroll-btn.owned:hover{transform:none}

/* ---- form fields ---- */
.field,.m-field{margin-bottom:var(--s4)}
.field label,.m-field label{display:block;margin-bottom:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.field input,.field select,.field textarea,.m-field input,.m-field select,.m-field textarea,.gate-input,.search-box,.price-input{
  width:100%;min-height:46px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,34,.9);
  color:var(--text);font:inherit;font-size:16px;outline:none;resize:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder,.field textarea::placeholder,.m-field input::placeholder,.m-field textarea::placeholder,.gate-input::placeholder{color:var(--text-3);opacity:.6}
.field input:focus,.field select:focus,.field textarea:focus,.m-field input:focus,.m-field select:focus,.m-field textarea:focus,.gate-input:focus,.search-box:focus,.price-input:focus{border-color:var(--line-cyan);box-shadow:0 0 0 3px rgba(34,211,238,.10)}
.field select option,.m-field select option{background:#0a1024}

/* ---- cards ---- */
.section-card,.profile-card,.sidebar-card,.summary-card,.chapter,.course-card,.stat-card,.table-wrap,.course-admin-card,.enrolled-course,.gate-card,.success-box{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}

/* ---- pop-up window ---- */
.modal-overlay{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(6px)}
.modal-overlay.open{display:flex}
.modal-box{width:100%;max-width:500px;max-height:100%;overflow:hidden;border-radius:var(--r-lg);background:#0a1024;border:1px solid var(--line-cyan);box-shadow:0 0 80px rgba(34,211,238,.10)}
.modal-close{flex-shrink:0;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text-2);font-size:15px;cursor:pointer;transition:.2s}
.modal-close:hover{background:rgba(34,211,238,.12);color:#fff}

@media(max-width:640px){:root{--gutter:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ COURSE DETAIL PAGE ============ */
.page{position:relative;z-index:2;max-width:var(--container);margin:0 auto;padding:var(--s6) var(--gutter) 120px;display:grid;grid-template-columns:1fr 330px;gap:var(--s6);align-items:start}
.content{min-width:0}
.breadcrumb{margin-bottom:var(--s5);font-size:13px;color:var(--text-3)}
.breadcrumb span{color:var(--cyan);cursor:pointer} .breadcrumb span:hover{text-decoration:underline}
.course-hero{margin-bottom:var(--s6)}
.course-tag{display:inline-block;margin-bottom:var(--s3);padding:3px 12px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.course-hero h1{margin-bottom:var(--s3);font-size:clamp(26px,3.6vw,38px);font-weight:800;line-height:1.15;letter-spacing:-.02em;color:var(--text)}
.course-hero p{max-width:620px;margin-bottom:var(--s5);font-size:16px;line-height:1.7}
.course-stats{display:flex;flex-wrap:wrap;gap:var(--s3) var(--s5)}
.stat{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-2)}
.stat-icon{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;font-size:15px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.18)}
.section-title{margin-bottom:var(--s4);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
/* chapter accordion */
.chapter{margin-bottom:var(--s3);overflow:hidden;border-radius:var(--r-md);transition:border-color .2s}
.chapter.open{border-color:var(--line-cyan)}
.chapter-header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:16px 20px;cursor:pointer;user-select:none;transition:background .2s}
.chapter-header:hover{background:rgba(34,211,238,.04)}
.chapter-left{display:flex;align-items:center;gap:14px;min-width:0}
.chapter-num{flex-shrink:0;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;font-size:13px;font-weight:700;color:var(--cyan);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.22)}
.chapter-info{min-width:0}
.chapter-name{margin-bottom:2px;font-size:16px;font-weight:600;color:var(--text)}
.chapter-sub{font-size:13px;color:var(--text-3)}
.chapter-right{display:flex;align-items:center;gap:var(--s3);flex-shrink:0}
.lock-badge{padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:600;background:rgba(100,116,139,.14);color:var(--text-3);border:1px solid var(--line)}
.lock-badge.free{background:rgba(52,211,153,.10);color:var(--green);border-color:rgba(52,211,153,.25)}
.chevron{font-size:12px;color:var(--text-3);transition:transform .25s}
.chapter.open .chevron{transform:rotate(180deg)}
.chapter-body{display:none;border-top:1px solid var(--line)}
.chapter.open .chapter-body{display:block}
/* video rows */
.video-row{position:relative;display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.video-row:last-child{border-bottom:0}
.video-row:hover{background:rgba(34,211,238,.05)}
.video-row.locked,.video-row.locked:hover{cursor:default;background:transparent}
.play-btn{flex-shrink:0;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:12px;color:#031018;background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));box-shadow:0 2px 10px rgba(34,211,238,.25)}
.play-btn.locked-btn{background:rgba(51,65,85,.5);box-shadow:none}
.video-info{flex:1;min-width:0}
.video-title{margin-bottom:2px;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-title.locked-title{color:var(--text-3)}
.video-meta{font-size:12px;color:var(--text-3)}
.free-tag{flex-shrink:0;padding:2px 9px;border-radius:var(--r-pill);font-size:10px;font-weight:600;background:rgba(52,211,153,.10);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.lock-icon{flex-shrink:0;font-size:14px;opacity:.6}
.lock-tooltip{position:absolute;right:56px;top:50%;transform:translateY(-50%);padding:6px 12px;border-radius:8px;background:#0a1024;border:1px solid var(--line-cyan);font-size:12px;color:var(--text-2);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.video-row.locked:hover .lock-tooltip{opacity:1}
/* price card (desktop) */
.sidebar{position:sticky;top:84px}
.sidebar-card{overflow:hidden;box-shadow:0 0 40px rgba(34,211,238,.06)}
.sidebar-thumb{position:relative;height:140px;overflow:hidden}
.sidebar-thumb svg{position:absolute;inset:0;width:100%;height:100%}
.sidebar-body{padding:20px}
.sidebar-title{margin-bottom:var(--s4);font-size:17px;font-weight:700;color:var(--text)}
.sidebar-stats{display:flex;flex-direction:column;gap:10px;margin-bottom:var(--s5);padding-bottom:var(--s5);border-bottom:1px solid var(--line)}
.s-stat{display:flex;justify-content:space-between;font-size:14px}
.s-stat .label{color:var(--text-3)} .s-stat .val{color:var(--text);font-weight:500}
.sidebar-price{margin-bottom:var(--s4);text-align:center}
.price-val{font-size:34px;font-weight:800;color:var(--gold)} .price-val .cur{font-size:18px}
.price-tbd{font-size:16px;color:var(--text-3)}
.price-note{margin-top:4px;font-size:12px;color:var(--text-3)}
.sidebar .enroll-btn{width:100%;min-height:50px;margin-bottom:10px;font-size:16px}
.guarantee{text-align:center;font-size:12px;color:var(--text-3)}
/* price bar (phones) */
.mobile-bar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;align-items:center;gap:var(--s4);padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom));background:rgba(5,8,20,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line-cyan)}
.mobile-price{font-size:22px;font-weight:800;color:var(--gold);white-space:nowrap} .mobile-price .cur{font-size:14px}
.mobile-enroll{flex:1;min-height:48px}
/* video pop-up (YouTube embed) */
.modal-box{max-width:860px}
.modal-header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:14px 20px;border-bottom:1px solid var(--line)}
.modal-title{max-width:calc(100% - 48px);font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-container{position:relative;width:100%;padding-top:56.25%;background:#000}
.video-container iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modal-footer{padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--text-3)}
.modal-course-tag span{color:var(--cyan)}
@media(max-width:860px){
  .page{grid-template-columns:1fr;gap:0;padding-bottom:110px}
  .sidebar{display:none}
  .mobile-bar{display:flex}
}
@media(max-width:480px){
  .chapter-right .lock-badge,.lock-tooltip{display:none}
  .chapter-header{padding:14px 16px} .video-row{padding:12px 16px}
}
</style>
</head>

          { title: "Work, Energy & Power", duration: "20:15", free: false },
        ]
      }
    ]
  }
];

/* ── read which course to show from URL param (?id=0) ── */
const params = new URLSearchParams(location.search);
const courseId = parseInt(params.get('id') || '0');
const course = courseData[courseId] || courseData[0];

/* ── pull in any chapter/video edits made in the admin panel ──
   The admin "Manage videos" screen (admin-mc2025.html) saves its
   edits to localStorage under 'mc_chapters_override', keyed by
   course id. If an override exists for this course, it replaces
   the hardcoded chapters above so new videos show up right away.
   SUPABASE TODO: replace this whole block with a
   supabase.from('chapters').select() call. */
try {
  const raw = localStorage.getItem('mc_chapters_override');
  if (raw) {
    const overrides = JSON.parse(raw);
    if (overrides && overrides[courseId]) {
      course.chapters = overrides[courseId];
    }
  }
} catch (e) { /* ignore bad/corrupted storage */ }

/* ── total video count ── */
const totalVideos = course.chapters.reduce((s, ch) => s + ch.videos.length, 0);
const freeCount = course.chapters.reduce((s, ch) => s + ch.videos.filter(v => v.free).length, 0);

/* ── thumbnail SVG shared ── */
function thumbSVG(course, w, h) {
  const col = course.tagColor;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${w}" height="${h}" fill="url(#tg${course.id})"/>
    <defs>
      <linearGradient id="tg${course.id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${course.accentFrom}"/>
        <stop offset="100%" stop-color="#050814"/>
      </linearGradient>
    </defs>
    <circle cx="${w/2}" cy="${h/2}" r="${h*0.55}" fill="none" stroke="${col}" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 6"/>
    <circle cx="${w/2}" cy="${h/2}" r="${h*0.32}" fill="none" stroke="${col}" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="3 5"/>
    <text x="${w/2}" y="${h/2+12}" text-anchor="middle" font-size="${h*0.45}" font-weight="900" fill="${col}" opacity="0.12" font-family="monospace">${course.tag==='HSC'?'∫':'x²'}</text>
  </svg>`;
}

/* ── render left content ── */
document.getElementById('content').innerHTML = `
  <div class="breadcrumb">
    <span onclick="location.href='courses.html'">Courses</span> › ${course.title}
  </div>

  <div class="course-hero">
    <span class="course-tag" style="background:${course.tagBg};color:${course.tagColor};border:1px solid ${course.tagColor}33">${course.tag}</span>
    <h1>${course.title}</h1>
    <p>${course.desc}</p>
    <div class="course-stats">
      <div class="stat"><div class="stat-icon">📚</div>${course.chapters.length} chapters</div>
      <div class="stat"><div class="stat-icon">🎬</div>${totalVideos} videos</div>
      <div class="stat"><div class="stat-icon">🔓</div>${freeCount} free previews</div>
      <div class="stat"><div class="stat-icon">♾️</div>Permanent access</div>
    </div>
  </div>

  <div class="section-title">Course Content</div>

  <div id="chapters"></div>
`;

/* ── render chapters ── */
const chapWrap = document.getElementById('chapters');
course.chapters.forEach((ch, ci) => {
  const lockedCount = ch.videos.filter(v => !v.free).length;
  const div = document.createElement('div');
  div.className = 'chapter' + (ci === 0 ? ' open' : '');
  div.innerHTML = `
    <div class="chapter-header" onclick="toggleChapter(this)">
      <div class="chapter-left">
        <div class="chapter-num">${String(ci+1).padStart(2,'0')}</div>
        <div class="chapter-info">
          <div class="chapter-name">${ch.name}</div>
          <div class="chapter-sub">${ch.videos.length} videos${lockedCount > 0 && !course.owned ? ` · ${lockedCount} locked` : ''}</div>
        </div>
      </div>
      <div class="chapter-right">
        ${ch.videos.some(v=>v.free) ? '<span class="lock-badge free">Free preview</span>' : ''}
        <span class="chevron">▼</span>
      </div>
    </div>
    <div class="chapter-body">
      ${ch.videos.map((v, vi) => {
        const isLocked = !v.free && !course.owned;
        return `
          <div class="video-row ${isLocked ? 'locked' : ''}" ${!isLocked ? `onclick="playVideo('${v.title}', '${v.youtubeId || ''}')"` : ''}>
            <div class="play-btn ${isLocked ? 'locked-btn' : ''}">
              ${isLocked ? '🔒' : '▶'}
            </div>
            <div class="video-info">
              <div class="video-title ${isLocked ? 'locked-title' : ''}">${v.title}</div>
              <div class="video-meta">${v.duration}</div>
            </div>
            ${v.free ? '<span class="free-tag">Free</span>' : ''}
            ${isLocked ? '<span class="lock-icon">🔒</span><div class="lock-tooltip">Purchase course to unlock</div>' : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
  chapWrap.appendChild(div);
});

/* ── render sidebar ── */
document.getElementById('sidebar').innerHTML = `
  <div class="sidebar-card">
    <div class="sidebar-thumb">${thumbSVG(course, 320, 140)}</div>
    <div class="sidebar-body">
      <div class="sidebar-title">${course.title}</div>
      <div class="sidebar-stats">
        <div class="s-stat"><span class="label">Chapters</span><span class="val">${course.chapters.length}</span></div>
        <div class="s-stat"><span class="label">Videos</span><span class="val">${totalVideos}</span></div>
        <div class="s-stat"><span class="label">Free previews</span><span class="val">${freeCount}</span></div>
        <div class="s-stat"><span class="label">Access</span><span class="val">Permanent ♾️</span></div>
      </div>
      <div class="sidebar-price">
        ${course.price
          ? `<div class="price-val"><span class="cur">৳</span>${course.price}</div>`
          : `<div class="price-tbd">Price coming soon</div>`}
        <div class="price-note">One-time payment · No subscription</div>
      </div>
      <button class="enroll-btn ${course.owned ? 'owned' : ''}" onclick="${course.owned ? '' : "location.href='purchase.html?id="+course.id+"'"}">
        ${course.owned ? '✓ You are enrolled' : 'Enroll now'}
      </button>
      <div class="guarantee">🔒 Secure payment via bKash</div>
    </div>
  </div>
`;

/* ── mobile bar ── */
document.getElementById('mobile-bar').innerHTML = `
  <div class="mobile-price">
    ${course.price ? `<span class="cur">৳</span>${course.price}` : 'Price TBD'}
  </div>
  <button class="mobile-enroll" onclick="${course.owned ? '' : "location.href='purchase.html?id="+course.id+"'"}">
    ${course.owned ? '✓ Enrolled' : 'Enroll now'}
  </button>
`;

/* ── interactions ── */
function toggleChapter(header) {
  header.parentElement.classList.toggle('open');
}

/* ── video modal ── */
/*
  HOW TO ADD REAL VIDEOS:
  In the courseData array, each video object can have a "youtubeId" field.
  Example: { title: "Introduction", duration: "12:30", free: true, youtubeId: "dQw4w9WgXcQ" }
  When youtubeId is present, the modal embeds that video.
  When missing, it shows a "coming soon" placeholder — safe during development.
*/
function playVideo(title, youtubeId) {
  const modal = document.getElementById('video-modal');
  const iframe = document.getElementById('modal-iframe');
  const modalTitle = document.getElementById('modal-title');
  const modalCourse = document.getElementById('modal-course-name');

  modalTitle.textContent = title;
  modalCourse.textContent = course.title;

  if (youtubeId) {
    iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0&modestbranding=1`;
  } else {
    iframe.src = `data:text/html,<html style="background:#050814;display:flex;align-items:center;justify-content:center;height:100%;margin:0;font-family:system-ui">
      <div style="text-align:center;color:#475569">
        <div style="font-size:48px;margin-bottom:16px">🎬</div>
        <div style="font-size:16px;color:#94a3b8;margin-bottom:8px">Video coming soon</div>
        <div style="font-size:13px">Add a youtubeId to this video in courseData</div>
      </div></html>`;
  }

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeVideoModal() {
  const modal = document.getElementById('video-modal');
  const iframe = document.getElementById('modal-iframe');
  modal.classList.remove('open');
  iframe.src = ''; // stop video playback
  document.body.style.overflow = '';
}

function closeModal(e) {
  // close if clicking the dark overlay (not the box itself)
  if (e.target === document.getElementById('video-modal')) closeVideoModal();
}

// close on Escape key
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideoModal(); });

/* ── ambient particles ── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
let mouse = { x: w/2, y: h/2 }, ripples = [], t = 0;
document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
document.addEventListener('click', e => { for(let i=0;i<3;i++) ripples.push({x:e.clientX,y:e.clientY,r:i*15,speed:1.8+i*0.4}); });
document.addEventListener('touchmove', e => { const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY; },{passive:true});
document.addEventListener('touchstart', e => { const touch=e.touches[0]; mouse.x=touch.clientX; mouse.y=touch.clientY; for(let i=0;i<3;i++) ripples.push({x:touch.clientX,y:touch.clientY,r:i*15,speed:1.8+i*0.4}); },{passive:true});
function draw() {
  ctx.fillStyle='rgba(5,8,20,0.13)'; ctx.fillRect(0,0,w,h); t+=0.003;
  const step=28;
  for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step) {
    const dx=x-mouse.x,dy=y-mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
    const wave=Math.sin(dist*0.018-t*5),influence=Math.max(0,1-dist/380);
    let ox=Math.sin(t+y*0.009)*7,oy=Math.cos(t+x*0.009)*7;
    for(const r of ripples){const rx=x-r.x,ry=y-r.y,d=Math.sqrt(rx*rx+ry*ry),rw=Math.sin(d*0.045-r.r*0.18),rf=Math.max(0,1-d/280);ox+=rw*rf*10;oy+=rw*rf*10;}
    const cr=x/w,rv=Math.round(34+cr*(245-34)),gv=Math.round(211+cr*(158-211)),bv=Math.round(238+cr*(11-238));
    ctx.fillStyle=`rgba(${rv},${gv},${bv},${0.03+wave*0.04+influence*0.1})`;
    ctx.fillRect(x+ox+wave*9,y+oy+wave*9,2,2);
  }
  ripples.forEach(r=>r.r+=r.speed); ripples=ripples.filter(r=>r.r<140);
  requestAnimationFrame(draw);
}
draw();
</script>
