<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Math Catalyst — Course</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #050814;
  color: white;
  min-height: 100vh;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* ── NAV ── */
nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 40px;
  background: rgba(5, 8, 20, 0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(34,211,238,0.1);
}

.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; cursor: pointer; }
.nav-logo img { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(34,211,238,0.3)); }
.nav-logo-text { line-height: 1.1; }
.nav-logo-text .the { font-size: 9px; letter-spacing: 3px; color: #f59e0b; text-transform: uppercase; }
.nav-logo-text .main { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 1px; }
.nav-logo-text .cat { font-size: 10px; letter-spacing: 3px; color: #22d3ee; text-transform: uppercase; }

.nav-right { display: flex; align-items: center; gap: 16px; }
.nav-back {
  padding: 7px 16px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: #94a3b8;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.nav-back:hover { border-color: rgba(34,211,238,0.3); color: #22d3ee; }

/* ── LAYOUT ── */
.page {
  position: relative;
  z-index: 2;
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 24px 120px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 32px;
  align-items: start;
}

/* ── LEFT: COURSE CONTENT ── */
.content { min-width: 0; }

.breadcrumb {
  font-size: 12px;
  color: #334155;
  margin-bottom: 20px;
}
.breadcrumb span { color: #22d3ee; cursor: pointer; }
.breadcrumb span:hover { text-decoration: underline; }

.course-hero {
  margin-bottom: 32px;
}

.course-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 20px;
  margin-bottom: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.course-hero h1 {
  font-size: 30px;
  font-weight: 800;
  color: #f0f6ff;
  margin-bottom: 12px;
  line-height: 1.2;
}

.course-hero p {
  color: #64748b;
  font-size: 15px;
  line-height: 1.7;
  max-width: 600px;
  margin-bottom: 20px;
}

.course-stats {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: #475569;
}

.stat-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  background: rgba(34,211,238,0.08);
  border: 1px solid rgba(34,211,238,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

/* ── CHAPTERS ── */
.section-title {
  font-size: 16px;
  font-weight: 700;
  color: #94a3b8;
  margin-bottom: 16px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-size: 12px;
}

.chapter {
  border: 1px solid rgba(34,211,238,0.1);
  border-radius: 12px;
  margin-bottom: 10px;
  background: rgba(10, 15, 35, 0.6);
  overflow: hidden;
  transition: border-color 0.2s;
}

.chapter.open { border-color: rgba(34,211,238,0.25); }

.chapter-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  cursor: pointer;
  user-select: none;
  transition: background 0.2s;
}

.chapter-header:hover { background: rgba(34,211,238,0.03); }

.chapter-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.chapter-num {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: rgba(34,211,238,0.08);
  border: 1px solid rgba(34,211,238,0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #22d3ee;
  flex-shrink: 0;
}

.chapter-info { min-width: 0; }
.chapter-name { font-size: 15px; font-weight: 600; color: #e2e8f0; margin-bottom: 2px; }
.chapter-sub { font-size: 12px; color: #334155; }

.chapter-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.lock-badge {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(100,116,139,0.12);
  color: #475569;
  border: 1px solid rgba(100,116,139,0.2);
}

.lock-badge.free {
  background: rgba(52,211,153,0.08);
  color: #34d399;
  border-color: rgba(52,211,153,0.2);
}

.chevron {
  font-size: 12px;
  color: #334155;
  transition: transform 0.25s;
}

.chapter.open .chevron { transform: rotate(180deg); }

.chapter-body {
  display: none;
  border-top: 1px solid rgba(34,211,238,0.08);
}

.chapter.open .chapter-body { display: block; }

/* ── VIDEO ROWS ── */
.video-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 20px;
  border-bottom: 1px solid rgba(34,211,238,0.05);
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}

.video-row:last-child { border-bottom: none; }
.video-row:hover { background: rgba(34,211,238,0.03); }

.video-row.locked { cursor: default; }
.video-row.locked:hover { background: transparent; }

.play-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #22d3ee, #0891b2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(34,211,238,0.25);
}

.play-btn.locked-btn {
  background: rgba(51,65,85,0.5);
  box-shadow: none;
}

.video-info { flex: 1; min-width: 0; }
.video-title { font-size: 14px; color: #cbd5e1; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.video-title.locked-title { color: #334155; }
.video-meta { font-size: 12px; color: #334155; }

.free-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(52,211,153,0.08);
  color: #34d399;
  border: 1px solid rgba(52,211,153,0.2);
  flex-shrink: 0;
}

.lock-icon { font-size: 14px; color: #334155; flex-shrink: 0; }

/* lock overlay tooltip */
.video-row.locked:hover .lock-tooltip { opacity: 1; }
.lock-tooltip {
  position: absolute;
  right: 56px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(10,15,35,0.95);
  border: 1px solid rgba(34,211,238,0.2);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  color: #94a3b8;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

/* ── RIGHT: STICKY SIDEBAR ── */
.sidebar {
  position: sticky;
  top: 82px;
}

.sidebar-card {
  border-radius: 16px;
  border: 1px solid rgba(34,211,238,0.15);
  background: rgba(10, 15, 35, 0.8);
  backdrop-filter: blur(16px);
  overflow: hidden;
  box-shadow: 0 0 40px rgba(34,211,238,0.05);
}

.sidebar-thumb {
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.sidebar-thumb svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.sidebar-body { padding: 20px; }

.sidebar-title { font-size: 16px; font-weight: 700; color: #e2e8f0; margin-bottom: 16px; }

.sidebar-stats {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(34,211,238,0.08);
}

.s-stat { display: flex; justify-content: space-between; font-size: 13px; }
.s-stat .label { color: #475569; }
.s-stat .val { color: #94a3b8; font-weight: 500; }

.sidebar-price {
  text-align: center;
  margin-bottom: 16px;
}

.price-val {
  font-size: 32px;
  font-weight: 800;
  color: #f59e0b;
}

.price-val .cur { font-size: 18px; }
.price-tbd { font-size: 15px; color: #475569; }
.price-note { font-size: 12px; color: #334155; margin-top: 4px; }

.enroll-btn {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  background: linear-gradient(135deg, #22d3ee, #0891b2);
  color: #050814;
  box-shadow: 0 4px 24px rgba(34,211,238,0.2);
  transition: all 0.2s;
  margin-bottom: 10px;
}

.enroll-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 32px rgba(34,211,238,0.3); }

.enroll-btn.owned {
  background: rgba(52,211,153,0.1);
  color: #34d399;
  border: 1px solid rgba(52,211,153,0.3);
  box-shadow: none;
  cursor: default;
}
.enroll-btn.owned:hover { transform: none; }

.guarantee {
  text-align: center;
  font-size: 12px;
  color: #334155;
}

/* ── MOBILE STICKY BAR ── */
.mobile-bar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 20;
  background: rgba(5, 8, 20, 0.95);
  backdrop-filter: blur(16px);
  border-top: 1px solid rgba(34,211,238,0.15);
  padding: 14px 20px;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.mobile-price { font-size: 22px; font-weight: 800; color: #f59e0b; }
.mobile-price .cur { font-size: 14px; }
.mobile-enroll {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #22d3ee, #0891b2);
  color: #050814;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

/* ── VIDEO MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.88);
  backdrop-filter: blur(6px);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.open { display: flex; }

.modal-box {
  width: 100%;
  max-width: 860px;
  border-radius: 16px;
  background: #0a0f1e;
  border: 1px solid rgba(34,211,238,0.2);
  box-shadow: 0 0 80px rgba(34,211,238,0.08);
  overflow: hidden;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(34,211,238,0.1);
}

.modal-title {
  font-size: 15px;
  font-weight: 600;
  color: #e2e8f0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: calc(100% - 48px);
}

.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid rgba(34,211,238,0.2);
  background: rgba(34,211,238,0.06);
  color: #94a3b8;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}

.modal-close:hover { background: rgba(34,211,238,0.12); color: #fff; }

.video-container {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9 */
  background: #000;
}

.video-container iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
}

.modal-footer {
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid rgba(34,211,238,0.08);
}

.modal-course-tag {
  font-size: 12px;
  color: #475569;
}

.modal-course-tag span { color: #22d3ee; }

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  nav { padding: 12px 20px; }
  .page { grid-template-columns: 1fr; padding: 24px 16px 100px; gap: 0; }
  .sidebar { display: none; }
  .mobile-bar { display: flex; }
  .course-hero h1 { font-size: 24px; }
  .modal-box { border-radius: 12px; }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- VIDEO MODAL -->
<div class="modal-overlay" id="video-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Video Title</div>
      <button class="modal-close" onclick="closeVideoModal()">✕</button>
    </div>
    <div class="video-container">
      <iframe id="modal-iframe"
        src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <div class="modal-footer">
      <div class="modal-course-tag">The Math Catalyst · <span id="modal-course-name"></span></div>
    </div>
  </div>
</div>

<nav>
  <div class="nav-logo" onclick="location.href='courses.html'">
    <img src="logo.png" alt="logo" />
    <div class="nav-logo-text">
      <div class="the">The</div>
      <div class="main">MATH</div>
      <div class="cat">Catalyst</div>
    </div>
  </div>
  <div class="nav-right">
    <button class="nav-back" onclick="location.href='courses.html'">← All Courses</button>
  </div>
</nav>

<div class="page">
  <div class="content" id="content"></div>
  <div class="sidebar" id="sidebar"></div>
</div>

<div class="mobile-bar" id="mobile-bar"></div>

<script>
/* ============================================================
   COURSE DATA — one object per course.

============================================================ */

    accentFrom: "#0a2a3a",

    price: null,

/* ── read which course to show from URL param (?id=0) ── */
const params = new URLSearchParams(location.search);
const courseId = parseInt(params.get('id') || '0');
const course = courseData[courseId] || courseData[0];

/* ── total video count ── */
const totalVideos = course.chapters.reduce((s, ch) => s + ch.videos.length, 0);
const freeCount = course.chapters.reduce((s, ch) => s + ch.videos.filter(v => v.free).length, 0);

/* ── thumbnail SVG shared ── */
function thumbSVG(course, w, h) {
  const col = course.tagColor;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${w}" height="${h}" fill="url(#tg${course.id})"/>
    <defs>
      <linearGradient id="tg${course.id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${course.accentFrom}"/>
        <stop offset="100%" stop-color="#050814"/>
      </linearGradient>
    </defs>
    <circle cx="${w/2}" cy="${h/2}" r="${h*0.55}" fill="none" stroke="${col}" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="4 6"/>
    <circle cx="${w/2}" cy="${h/2}" r="${h*0.32}" fill="none" stroke="${col}" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="3 5"/>
    <text x="${w/2}" y="${h/2+12}" text-anchor="middle" font-size="${h*0.45}" font-weight="900" fill="${col}" opacity="0.12" font-family="monospace">${course.tag==='HSC'?'∫':'x²'}</text>
  </svg>`;
}

/* ── render left content ── */
document.getElementById('content').innerHTML = `
  <div class="breadcrumb">
    <span onclick="location.href='courses.html'">Courses</span> › ${course.title}
  </div>

  <div class="course-hero">
    <span class="course-tag" style="background:${course.tagBg};color:${course.tagColor};border:1px solid ${course.tagColor}33">${course.tag}</span>
    <h1>${course.title}</h1>
    <p>${course.desc}</p>
    <div class="course-stats">
      <div class="stat"><div class="stat-icon">📚</div>${course.chapters.length} chapters</div>
      <div class="stat"><div class="stat-icon">🎬</div>${totalVideos} videos</div>
      <div class="stat"><div class="stat-icon">🔓</div>${freeCount} free previews</div>
      <div class="stat"><div class="stat-icon">♾️</div>Permanent access</div>
    </div>
  </div>

  <div class="section-title">Course Content</div>

  <div id="chapters"></div>
`;

/* ── render chapters ── */
const chapWrap = document.getElementById('chapters');
course.chapters.forEach((ch, ci) => {
  const lockedCount = ch.videos.filter(v => !v.free).length;
  const div = document.createElement('div');
  div.className = 'chapter' + (ci === 0 ? ' open' : '');
  div.innerHTML = `
    <div class="chapter-header" onclick="toggleChapter(this)">
      <div class="chapter-left">
        <div class="chapter-num">${String(ci+1).padStart(2,'0')}</div>
        <div class="chapter-info">
          <div class="chapter-name">${ch.name}</div>
          <div class="chapter-sub">${ch.videos.length} videos${lockedCount > 0 && !course.owned ? ` · ${lockedCount} locked` : ''}</div>
        </div>
      </div>
      <div class="chapter-right">
        ${ch.videos.some(v=>v.free) ? '<span class="lock-badge free">Free preview</span>' : ''}
        <span class="chevron">▼</span>
      </div>
    </div>
    <div class="chapter-body">
      ${ch.videos.map((v, vi) => {
        const isLocked = !v.free && !course.owned;
        return `
          <div class="video-row ${isLocked ? 'locked' : ''}" ${!isLocked ? `onclick="playVideo('${v.title}', '${v.youtubeId || ''}')"` : ''}>
            <div class="play-btn ${isLocked ? 'locked-btn' : ''}">
              ${isLocked ? '🔒' : '▶'}
            </div>
            <div class="video-info">
              <div class="video-title ${isLocked ? 'locked-title' : ''}">${v.title}</div>
              <div class="video-meta">${v.duration}</div>
            </div>
            ${v.free ? '<span class="free-tag">Free</span>' : ''}
            ${isLocked ? '<span class="lock-icon">🔒</span><div class="lock-tooltip">Purchase course to unlock</div>' : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
  chapWrap.appendChild(div);
});

/* ── interactions ── */
function toggleChapter(header) {
  header.parentElement.classList.toggle('open');
}

/* ── video modal ── */
/*
  HOW TO ADD REAL VIDEOS:
  In the courseData array, each video object can have a "youtubeId" field.
  Example: { title: "Introduction", duration: "12:30", free: true, youtubeId: "dQw4w9WgXcQ" }
  When youtubeId is present, the modal embeds that video.
  When missing, it shows a "coming soon" placeholder — safe during development.
*/
function playVideo(title, youtubeId) {
  const modal = document.getElementById('video-modal');
  const iframe = document.getElementById('modal-iframe');
  const modalTitle = document.getElementById('modal-title');
  const modalCourse = document.getElementById('modal-course-name');

  modalTitle.textContent = title;
  modalCourse.textContent = course.title;

  if (youtubeId) {
    iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0&modestbranding=1`;
  } else {
    iframe.src = `data:text/html,<html style="background:#050814;display:flex;align-items:center;justify-content:center;height:100%;margin:0;font-family:system-ui">
      <div style="text-align:center;color:#475569">
        <div style="font-size:48px;margin-bottom:16px">🎬</div>
        <div style="font-size:16px;color:#94a3b8;margin-bottom:8px">Video coming soon</div>
        <div style="font-size:13px">Add a youtubeId to this video in courseData</div>
      </div></html>`;
  }

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeVideoModal() {
  const modal = document.getElementById('video-modal');
  const iframe = document.getElementById('modal-iframe');
  modal.classList.remove('open');
  iframe.src = ''; // stop video playback
  document.body.style.overflow = '';
}

function closeModal(e) {
  // close if clicking the dark overlay (not the box itself)
  if (e.target === document.getElementById('video-modal')) closeVideoModal();
}

// close on Escape key
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideoModal(); });

/* ── ambient particles ── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
let mouse = { x: w/2, y: h/2 }, ripples = [], t = 0;
document.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
document.addEventListener('click', e => { for(let i=0;i<3;i++) ripples.push({x:e.clientX,y:e.clientY,r:i*15,speed:1.8+i*0.4}); });
document.addEventListener('touchmove', e => { const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY; },{passive:true});
document.addEventListener('touchstart', e => { const touch=e.touches[0]; mouse.x=touch.clientX; mouse.y=touch.clientY; for(let i=0;i<3;i++) ripples.push({x:touch.clientX,y:touch.clientY,r:i*15,speed:1.8+i*0.4}); },{passive:true});
function draw() {
  ctx.fillStyle='rgba(5,8,20,0.13)'; ctx.fillRect(0,0,w,h); t+=0.003;
  const step=28;
  for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step) {
    const dx=x-mouse.x,dy=y-mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
    const wave=Math.sin(dist*0.018-t*5),influence=Math.max(0,1-dist/380);
    let ox=Math.sin(t+y*0.009)*7,oy=Math.cos(t+x*0.009)*7;
    for(const r of ripples){const rx=x-r.x,ry=y-r.y,d=Math.sqrt(rx*rx+ry*ry),rw=Math.sin(d*0.045-r.r*0.18),rf=Math.max(0,1-d/280);ox+=rw*rf*10;oy+=rw*rf*10;}
    const cr=x/w,rv=Math.round(34+cr*(245-34)),gv=Math.round(211+cr*(158-211)),bv=Math.round(238+cr*(11-238));
    ctx.fillStyle=`rgba(${rv},${gv},${bv},${0.03+wave*0.04+influence*0.1})`;
    ctx.fillRect(x+ox+wave*9,y+oy+wave*9,2,2);
  }
  ripples.forEach(r=>r.r+=r.speed); ripples=ripples.filter(r=>r.r<140);
  requestAnimationFrame(draw);
}
draw();
</script>
