<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — The Math Catalyst</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #050814;
  color: white;
  min-height: 100vh;
}

canvas { position: fixed; inset: 0; z-index: 0; }

/* NAV */
nav {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 40px;
  background: rgba(5,8,20,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(34,211,238,0.1);
}
.nav-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.nav-logo img { width: 36px; height: 36px; object-fit: contain; filter: drop-shadow(0 0 6px rgba(34,211,238,0.3)); }
.nav-logo-text .the  { font-size: 9px;  letter-spacing: 3px; color: #f59e0b; text-transform: uppercase; }
.nav-logo-text .main { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 1px; }
.nav-logo-text .cat  { font-size: 10px; letter-spacing: 3px; color: #22d3ee; text-transform: uppercase; }
.nav-right { display: flex; align-items: center; gap: 12px; }
.nav-btn {
  padding: 7px 16px; border-radius: 8px;
  border: 1px solid rgba(34,211,238,0.2);
  background: transparent; color: #94a3b8;
  font-size: 13px; cursor: pointer; transition: all 0.2s;
}
.nav-btn:hover { border-color: rgba(34,211,238,0.4); color: #22d3ee; }

/* PAGE */
.page {
  position: relative; z-index: 2;
  max-width: 1000px; margin: 0 auto;
  padding: 40px 24px 80px;
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 28px;
  align-items: start;
}

/* LEFT SIDEBAR */
.profile-sidebar {
  position: sticky;
  top: 82px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.profile-card {
  border-radius: 16px;
  border: 1px solid rgba(34,211,238,0.12);
  background: rgba(10,15,35,0.8);
  backdrop-filter: blur(16px);
  padding: 24px;
  text-align: center;
}

.avatar {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(245,158,11,0.2));
  border: 2px solid rgba(34,211,238,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 800; color: #22d3ee;
  margin: 0 auto 14px;
  text-transform: uppercase;
}

.profile-name { font-size: 17px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
.profile-email { font-size: 12px; color: #475569; margin-bottom: 14px; }

.profile-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
.profile-tag {
  font-size: 11px; padding: 3px 10px; border-radius: 10px;
  background: rgba(34,211,238,0.07);
  border: 1px solid rgba(34,211,238,0.15);
  color: #22d3ee;
}

.profile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.p-stat {
  border-radius: 10px;
  background: rgba(5,8,20,0.6);
  border: 1px solid rgba(34,211,238,0.08);
  padding: 12px;
  text-align: center;
}
.p-stat .val { font-size: 22px; font-weight: 800; color: #f59e0b; }
.p-stat .lbl { font-size: 11px; color: #334155; margin-top: 2px; }

/* side nav links */
.side-nav-links { display: flex; flex-direction: column; gap: 2px; }
.side-link {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 9px;
  font-size: 14px; color: #475569;
  cursor: pointer; transition: all 0.15s;
  border: 1px solid transparent;
}
.side-link:hover { color: #94a3b8; background: rgba(34,211,238,0.04); }
.side-link.active { color: #22d3ee; background: rgba(34,211,238,0.07); border-color: rgba(34,211,238,0.15); }
.side-link-icon { font-size: 16px; width: 20px; text-align: center; }

/* RIGHT CONTENT */
.profile-content { min-width: 0; }

.section { display: none; }
.section.active { display: block; }

.section-card {
  border-radius: 14px;
  border: 1px solid rgba(34,211,238,0.12);
  background: rgba(10,15,35,0.7);
  backdrop-filter: blur(12px);
  padding: 24px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 15px; font-weight: 700; color: #94a3b8;
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}

/* FIELDS */
.field { margin-bottom: 16px; }
.field label {
  display: block; font-size: 11px; font-weight: 600;
  color: #475569; text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.field input, .field select {
  width: 100%; padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(51,65,85,0.8);
  background: rgba(15,23,42,0.8);
  color: #e2e8f0; font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.field input:focus, .field select:focus { border-color: rgba(34,211,238,0.45); box-shadow: 0 0 0 3px rgba(34,211,238,0.06); }
.field input:disabled {
  color: #334155; cursor: not-allowed;
  background: rgba(15,23,42,0.4);
  border-color: rgba(30,42,58,0.8);
}
.field select option { background: #0a0f1e; }
.field-note { font-size: 11px; color: #1e2a3a; margin-top: 5px; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

.save-btn {
  padding: 10px 24px; border-radius: 9px; border: none;
  background: linear-gradient(135deg, #22d3ee, #0891b2);
  color: #050814; font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.save-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(34,211,238,0.25); }

.save-confirm {
  display: inline-block; font-size: 13px; color: #34d399;
  margin-left: 12px; opacity: 0; transition: opacity 0.3s;
}
.save-confirm.show { opacity: 1; }

/* ENROLLED COURSES */
.enrolled-course {
  border-radius: 12px;
  border: 1px solid rgba(34,211,238,0.1);
  background: rgba(5,8,20,0.5);
  padding: 18px 20px;
  margin-bottom: 12px;
  transition: border-color 0.2s;
}
.enrolled-course:hover { border-color: rgba(34,211,238,0.2); }

.ec-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; gap: 12px; }
.ec-info { flex: 1; min-width: 0; }
.ec-tag {
  font-size: 10px; font-weight: 700; padding: 2px 8px;
  border-radius: 8px; letter-spacing: 1px; text-transform: uppercase;
  display: inline-block; margin-bottom: 6px;
}
.ec-title { font-size: 15px; font-weight: 700; color: #e2e8f0; margin-bottom: 3px; }
.ec-meta { font-size: 12px; color: #334155; }

.go-btn {
  padding: 7px 16px; border-radius: 8px;
  border: 1px solid rgba(34,211,238,0.25);
  background: rgba(34,211,238,0.06);
  color: #22d3ee; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
}
.go-btn:hover { background: rgba(34,211,238,0.12); }

/* PROGRESS BAR */
.progress-section { margin-top: 4px; }
.progress-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.progress-label { font-size: 12px; color: #475569; }
.progress-pct { font-size: 12px; font-weight: 700; color: #22d3ee; }

.progress-bar-bg {
  width: 100%; height: 6px; border-radius: 3px;
  background: rgba(34,211,238,0.08);
  margin-bottom: 10px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, #22d3ee, #0891b2);
  transition: width 0.6s ease;
}

.video-checklist { margin-top: 10px; display: none; }
.video-checklist.open { display: block; }

.chapter-group { margin-bottom: 10px; }
.chapter-group-title {
  font-size: 11px; font-weight: 700; color: #334155;
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 6px; padding-left: 2px;
}

.video-check-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 8px;
  cursor: pointer; transition: background 0.15s;
  margin-bottom: 2px;
}
.video-check-item:hover { background: rgba(34,211,238,0.04); }

.check-box {
  width: 18px; height: 18px; border-radius: 5px;
  border: 1.5px solid rgba(34,211,238,0.25);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex-shrink: 0; transition: all 0.15s;
}
.check-box.checked { background: rgba(52,211,153,0.15); border-color: #34d399; color: #34d399; }

.video-check-title {
  font-size: 13px; color: #64748b; flex: 1;
  transition: color 0.15s;
}
.video-check-title.checked { color: #94a3b8; text-decoration: line-through; text-decoration-color: #334155; }

.video-check-dur { font-size: 11px; color: #1e2a3a; }

.toggle-checklist {
  font-size: 12px; color: #334155; cursor: pointer;
  display: flex; align-items: center; gap: 5px;
  transition: color 0.15s; margin-top: 6px;
  background: none; border: none; padding: 0;
}
.toggle-checklist:hover { color: #22d3ee; }

/* ENROLLMENT HISTORY */
.history-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid rgba(34,211,238,0.06);
  gap: 12px;
}
.history-row:last-child { border-bottom: none; }
.history-course { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-bottom: 3px; }
.history-date { font-size: 12px; color: #334155; }
.history-amount { font-size: 16px; font-weight: 800; color: #f59e0b; white-space: nowrap; }
.history-amount.tbd { font-size: 13px; color: #334155; font-weight: 500; }
.history-status {
  font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 10px;
  background: rgba(52,211,153,0.1); color: #34d399;
  border: 1px solid rgba(52,211,153,0.2);
  white-space: nowrap;
}

/* empty state */
.empty-state {
  text-align: center; padding: 48px 0; color: #1e2a3a;
}
.empty-state .e-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }
.empty-state .browse-btn {
  display: inline-block; margin-top: 16px;
  padding: 9px 20px; border-radius: 9px;
  border: none;
  background: linear-gradient(135deg, #22d3ee, #0891b2);
  color: #050814; font-size: 13px; font-weight: 700; cursor: pointer;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  nav { padding: 12px 20px; }
  .page { grid-template-columns: 1fr; padding: 20px 16px 60px; }
  .profile-sidebar { position: static; }
  .side-nav-links { flex-direction: row; flex-wrap: wrap; }
  .row2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<nav>
  <div class="nav-logo" onclick="location.href='courses.html'">
    <img src="logo.png" alt="logo" />
    <div class="nav-logo-text">
      <div class="the">The</div>
      <div class="main">MATH</div>
      <div class="cat">Catalyst</div>
    </div>
  </div>
  <div class="nav-right">
    <button class="nav-btn" onclick="location.href='courses.html'">← Courses</button>
    <button class="nav-btn" onclick="location.href='index.html'">Sign out</button>
  </div>
</nav>

<div class="page">

  <!-- LEFT -->
  <div class="profile-sidebar">
    <div class="profile-card">
      <div class="avatar" id="avatar-initials">?</div>
      <div class="profile-name" id="sidebar-name">—</div>
      <div class="profile-email" id="sidebar-email">—</div>
      <div class="profile-tags" id="sidebar-tags"></div>
      <div class="profile-stats">
        <div class="p-stat">
          <div class="val" id="stat-courses">0</div>
          <div class="lbl">Courses</div>
        </div>
        <div class="p-stat">
          <div class="val" id="stat-videos">0</div>
          <div class="lbl">Watched</div>
        </div>
      </div>
    </div>

    <div class="side-nav-links">
      <div class="side-link active" onclick="showSection('courses', this)">
        <span class="side-link-icon">📚</span> My Courses
      </div>
      <div class="side-link" onclick="showSection('history', this)">
        <span class="side-link-icon">🧾</span> History
      </div>
      <div class="side-link" onclick="showSection('settings', this)">
        <span class="side-link-icon">⚙️</span> Settings
      </div>
      <div class="side-link" onclick="showSection('password', this)">
        <span class="side-link-icon">🔒</span> Password
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="profile-content">

    <!-- MY COURSES -->
    <div class="section active" id="section-courses">
      <div class="section-card">
        <div class="card-title">📚 My Courses</div>
        <div id="enrolled-list"></div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="section" id="section-history">
      <div class="section-card">
        <div class="card-title">🧾 Enrollment History</div>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- SETTINGS -->
    <div class="section" id="section-settings">
      <div class="section-card">
        <div class="card-title">⚙️ Profile Settings</div>
        <div class="field">
          <label>Full name</label>
          <input type="text" id="f-name" placeholder="Your full name" />
        </div>
        <div class="field">
          <label>Email address</label>
          <input type="email" id="f-email" disabled />
          <div class="field-note">Email cannot be changed — it's your account identity</div>
        </div>
        <div class="row2">
          <div class="field">
            <label>Class</label>
            <select id="f-class">
              <option value="">Select class</option>
              <option>Class 9</option>
              <option>Class 10</option>
              <option>HSC 1st Year</option>
              <option>HSC 2nd Year</option>
            </select>
          </div>
          <div class="field">
            <label>School / College</label>
            <input type="text" id="f-school" placeholder="Your institution" />
          </div>
        </div>
        <div style="display:flex;align-items:center;margin-top:8px">
          <button class="save-btn" onclick="saveSettings()">Save changes</button>
          <span class="save-confirm" id="settings-confirm">✓ Saved</span>
        </div>
      </div>
    </div>

    <!-- PASSWORD -->
    <div class="section" id="section-password">
      <div class="section-card">
        <div class="card-title">🔒 Change Password</div>
        <!--
          SUPABASE TODO:
          Call supabase.auth.updateUser({ password: newPassword })
          Show success/error based on response.
        -->
        <div class="field">
          <label>Current password</label>
          <input type="password" id="pw-current" placeholder="••••••••" />
        </div>
        <div class="field">
          <label>New password</label>
          <input type="password" id="pw-new" placeholder="••••••••" />
        </div>
        <div class="field">
          <label>Confirm new password</label>
          <input type="password" id="pw-confirm" placeholder="••••••••" />
        </div>
        <div style="display:flex;align-items:center;margin-top:8px">
          <button class="save-btn" onclick="changePassword()">Update password</button>
          <span class="save-confirm" id="pw-confirm-msg"></span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   MOCK STUDENT DATA
   SUPABASE TODO: replace with
     const { data: { user } } = await supabase.auth.getUser()
     const { data: profile } = await supabase.from('profiles').select().eq('id', user.id).single()
     const { data: enrollments } = await supabase.from('enrollments').select('*, courses(*)').eq('user_id', user.id)
═══════════════════════════════════════════════════ */
const student = {
  name:   "Rahim Uddin",
  email:  "rahim@gmail.com",
  class:  "Class 9",
  school: "Ideal School & College",
};

/*
  watched: stored as a Set of video IDs ("courseId-chapterIdx-videoIdx")
  SUPABASE TODO: load from supabase.from('watch_progress').select().eq('user_id', user.id)
  and save on toggle with upsert.
*/
const watchedSet = new Set(
  JSON.parse(localStorage.getItem('mc_watched') || '[]')
);

function saveWatched() {
  try { localStorage.setItem('mc_watched', JSON.stringify([...watchedSet])); } catch(e){}
}

const enrolledCourses = [
  {
    id: 0, title: "Class 9 Math", tag: "SSC",
    tagColor: "#22d3ee", tagBg: "rgba(34,211,238,0.08)",
    purchasedDate: "Jun 10, 2026", price: null,
    chapters: [
      { name: "Real Numbers & Surds",      videos: [{t:"Introduction to Real Numbers",d:"12:30"},{t:"Rational vs Irrational Numbers",d:"15:45"},{t:"Surds — Simplification",d:"18:20"},{t:"Operations on Surds",d:"22:10"}] },
      { name: "Algebraic Expressions",     videos: [{t:"Polynomials — Basics",d:"14:00"},{t:"Factorisation Techniques",d:"20:15"},{t:"Algebraic Identities",d:"17:40"},{t:"Remainder & Factor Theorem",d:"25:00"}] },
      { name: "Linear Equations",          videos: [{t:"Solving One-Variable Equations",d:"13:20"},{t:"Simultaneous Equations",d:"19:50"},{t:"Word Problems",d:"21:00"}] },
      { name: "Geometry — Triangles",      videos: [{t:"Triangle Congruence",d:"16:30"},{t:"Triangle Similarity",d:"18:45"},{t:"Pythagoras Theorem",d:"20:00"}] },
      { name: "Trigonometry",              videos: [{t:"Intro to Trigonometric Ratios",d:"14:55"},{t:"sin, cos, tan — Values",d:"17:20"},{t:"Trigonometric Identities",d:"22:30"},{t:"Height & Distance Problems",d:"26:00"}] },
    ]
  }
];

const enrollmentHistory = [
  { course: "Class 9 Math", date: "Jun 10, 2026", amount: null, status: "Active" },
];

/* ── init ── */
function init() {
  // sidebar
  document.getElementById('avatar-initials').textContent = student.name.split(' ').map(w=>w[0]).join('').slice(0,2);
  document.getElementById('sidebar-name').textContent = student.name;
  document.getElementById('sidebar-email').textContent = student.email;

  const tags = document.getElementById('sidebar-tags');
  tags.innerHTML = `<span class="profile-tag">${student.class}</span><span class="profile-tag">${student.school.split(' ')[0]}</span>`;

  // total watched
  let totalVideos = 0;
  enrolledCourses.forEach(c => c.chapters.forEach(ch => totalVideos += ch.videos.length));
  const totalWatched = [...watchedSet].filter(k => enrolledCourses.some(c => k.startsWith(c.id+'-'))).length;

  document.getElementById('stat-courses').textContent = enrolledCourses.length;
  document.getElementById('stat-videos').textContent = totalWatched;

  // settings form
  document.getElementById('f-name').value   = student.name;
  document.getElementById('f-email').value  = student.email;
  document.getElementById('f-class').value  = student.class;
  document.getElementById('f-school').value = student.school;

  renderCourses();
  renderHistory();
}

/* ── section switching ── */
function showSection(name, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.side-link').forEach(s => s.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  el.classList.add('active');
}

/* ── RENDER ENROLLED COURSES ── */
function renderCourses() {
  const list = document.getElementById('enrolled-list');
  if (!enrolledCourses.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="e-icon">📭</div>
        <p>You haven't enrolled in any courses yet.</p>
        <button class="browse-btn" onclick="location.href='courses.html'">Browse courses</button>
      </div>`;
    return;
  }

  list.innerHTML = enrolledCourses.map(c => {
    const totalVids = c.chapters.reduce((s,ch) => s + ch.videos.length, 0);
    const watchedVids = c.chapters.reduce((s,ch,ci) =>
      s + ch.videos.filter((_,vi) => watchedSet.has(`${c.id}-${ci}-${vi}`)).length, 0);
    const pct = totalVids ? Math.round(watchedVids / totalVids * 100) : 0;

    const checklistId = `checklist-${c.id}`;
    const chaptersHtml = c.chapters.map((ch, ci) => `
      <div class="chapter-group">
        <div class="chapter-group-title">${ch.name}</div>
        ${ch.videos.map((v, vi) => {
          const key = `${c.id}-${ci}-${vi}`;
          const checked = watchedSet.has(key);
          return `
            <div class="video-check-item" onclick="toggleWatch('${key}', '${c.id}')">
              <div class="check-box ${checked ? 'checked' : ''}" id="cb-${key}">${checked ? '✓' : ''}</div>
              <span class="video-check-title ${checked ? 'checked' : ''}" id="ct-${key}">${v.t}</span>
              <span class="video-check-dur">${v.d}</span>
            </div>`;
        }).join('')}
      </div>`).join('');

    return `
      <div class="enrolled-course">
        <div class="ec-top">
          <div class="ec-info">
            <span class="ec-tag" style="background:${c.tagBg};color:${c.tagColor};border:1px solid ${c.tagColor}33">${c.tag}</span>
            <div class="ec-title">${c.title}</div>
            <div class="ec-meta">Enrolled ${c.purchasedDate} · ${totalVids} videos · ${watchedVids} watched</div>
          </div>
          <button class="go-btn" onclick="location.href='course.html?id=${c.id}'">Go to course →</button>
        </div>
        <div class="progress-section">
          <div class="progress-header">
            <span class="progress-label">Progress</span>
            <span class="progress-pct" id="pct-${c.id}">${pct}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="bar-${c.id}" style="width:${pct}%"></div>
          </div>
          <button class="toggle-checklist" onclick="toggleChecklist('${checklistId}', this)">
            ▶ Show video checklist (${watchedVids}/${totalVids} watched)
          </button>
          <div class="video-checklist" id="${checklistId}">
            ${chaptersHtml}
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggleChecklist(id, btn) {
  const el = document.getElementById(id);
  const open = el.classList.toggle('open');
  const courseId = id.replace('checklist-','');
  const c = enrolledCourses.find(x => String(x.id) === courseId);
  const totalVids = c ? c.chapters.reduce((s,ch)=>s+ch.videos.length,0) : 0;
  const watchedVids = [...watchedSet].filter(k=>k.startsWith(courseId+'-')).length;
  btn.textContent = (open ? '▼' : '▶') + ` ${open ? 'Hide' : 'Show'} video checklist (${watchedVids}/${totalVids} watched)`;
}

function toggleWatch(key, courseId) {
  if (watchedSet.has(key)) watchedSet.delete(key);
  else watchedSet.add(key);
  saveWatched();

  // update checkbox UI
  const cb = document.getElementById('cb-' + key);
  const ct = document.getElementById('ct-' + key);
  const watched = watchedSet.has(key);
  if (cb) { cb.classList.toggle('checked', watched); cb.textContent = watched ? '✓' : ''; }
  if (ct) ct.classList.toggle('checked', watched);

  // recalculate progress for this course
  const c = enrolledCourses.find(x => String(x.id) === courseId);
  if (!c) return;
  const totalVids = c.chapters.reduce((s,ch)=>s+ch.videos.length,0);
  const watchedVids = c.chapters.reduce((s,ch,ci)=>
    s+ch.videos.filter((_,vi)=>watchedSet.has(`${c.id}-${ci}-${vi}`)).length,0);
  const pct = totalVids ? Math.round(watchedVids/totalVids*100) : 0;

  const barEl = document.getElementById('bar-' + courseId);
  const pctEl = document.getElementById('pct-' + courseId);
  if (barEl) barEl.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';

  // update sidebar stat
  const totalWatched = [...watchedSet].filter(k=>enrolledCourses.some(c=>k.startsWith(c.id+'-'))).length;
  document.getElementById('stat-videos').textContent = totalWatched;
}

/* ── RENDER HISTORY ── */
function renderHistory() {
  const list = document.getElementById('history-list');
  if (!enrollmentHistory.length) {
    list.innerHTML = '<div class="empty-state"><div class="e-icon">🧾</div><p>No enrollment history yet.</p></div>';
    return;
  }
  list.innerHTML = enrollmentHistory.map(h => `
    <div class="history-row">
      <div>
        <div class="history-course">${h.course}</div>
        <div class="history-date">${h.date}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        ${h.amount
          ? `<span class="history-amount">৳${h.amount}</span>`
          : `<span class="history-amount tbd">Price TBD</span>`}
        <span class="history-status">${h.status}</span>
      </div>
    </div>
  `).join('');
}

/* ── SAVE SETTINGS ── */
function saveSettings() {
  /*
    SUPABASE TODO:
    await supabase.from('profiles').update({
      name: ..., class: ..., school: ...
    }).eq('id', user.id)
  */
  student.name   = document.getElementById('f-name').value.trim() || student.name;
  student.class  = document.getElementById('f-class').value  || student.class;
  student.school = document.getElementById('f-school').value || student.school;

  // update sidebar live
  document.getElementById('sidebar-name').textContent = student.name;
  document.getElementById('avatar-initials').textContent = student.name.split(' ').map(w=>w[0]).join('').slice(0,2);

  const confirm = document.getElementById('settings-confirm');
  confirm.classList.add('show');
  setTimeout(() => confirm.classList.remove('show'), 2500);
}

/* ── CHANGE PASSWORD ── */
function changePassword() {
  const cur     = document.getElementById('pw-current').value;
  const nw      = document.getElementById('pw-new').value;
  const confirm = document.getElementById('pw-confirm').value;
  const msg     = document.getElementById('pw-confirm-msg');

  if (!cur || !nw || !confirm) { showPwMsg('Please fill in all fields.', '#f87171'); return; }
  if (nw.length < 8)           { showPwMsg('Password must be at least 8 characters.', '#f87171'); return; }
  if (nw !== confirm)          { showPwMsg("Passwords don't match.", '#f87171'); return; }

  /*
    SUPABASE TODO:
    const { error } = await supabase.auth.updateUser({ password: nw })
    if (error) showPwMsg(error.message, '#f87171')
    else showPwMsg('Password updated!', '#34d399')
  */
  document.getElementById('pw-current').value = '';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-confirm').value = '';
  showPwMsg('✓ Password updated!', '#34d399');
}

function showPwMsg(text, color) {
  const msg = document.getElementById('pw-confirm-msg');
  msg.textContent = text;
  msg.style.color = color;
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 3000);
}

init();

/* ── ambient particles ── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
let mouse = {x:w/2,y:h/2}, ripples=[], t=0;
document.addEventListener('mousemove', e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
document.addEventListener('click', e=>{for(let i=0;i<3;i++) ripples.push({x:e.clientX,y:e.clientY,r:i*15,speed:1.8+i*0.4});});
document.addEventListener('touchmove', e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;},{passive:true});
document.addEventListener('touchstart', e=>{const touch=e.touches[0];mouse.x=touch.clientX;mouse.y=touch.clientY;for(let i=0;i<3;i++) ripples.push({x:touch.clientX,y:touch.clientY,r:i*15,speed:1.8+i*0.4});},{passive:true});
function draw(){
  ctx.fillStyle='rgba(5,8,20,0.13)';ctx.fillRect(0,0,w,h);t+=0.003;
  const step=28;
  for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step){
    const dx=x-mouse.x,dy=y-mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
    const wave=Math.sin(dist*0.018-t*5),influence=Math.max(0,1-dist/380);
    let ox=Math.sin(t+y*0.009)*7,oy=Math.cos(t+x*0.009)*7;
    for(const r of ripples){const rx=x-r.x,ry=y-r.y,d=Math.sqrt(rx*rx+ry*ry),rw=Math.sin(d*0.045-r.r*0.18),rf=Math.max(0,1-d/280);ox+=rw*rf*10;oy+=rw*rf*10;}
    const cr=x/w,rv=Math.round(34+cr*(245-34)),gv=Math.round(211+cr*(158-211)),bv=Math.round(238+cr*(11-238));
    ctx.fillStyle=`rgba(${rv},${gv},${bv},${0.03+wave*0.04+influence*0.1})`;
    ctx.fillRect(x+ox+wave*9,y+oy+wave*9,2,2);
  }
  ripples.forEach(r=>r.r+=r.speed);ripples=ripples.filter(r=>r.r<140);
  requestAnimationFrame(draw);
}
draw();
</script>
