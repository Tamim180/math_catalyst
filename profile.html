<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — The Math Catalyst</title>
<meta name="theme-color" content="#050814" />
<!-- Font: Plus Jakarta Sans (phone falls back to its system font if it cannot load) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   SHARED DESIGN LANGUAGE (same block on every page)
   Change colours / rounding / spacing here to retheme the site.
============================================================ */
:root{
  --bg:#050814; --surface:rgba(13,20,42,.78); --surface-2:rgba(21,31,60,.82);
  --line:rgba(148,163,184,.16); --line-cyan:rgba(34,211,238,.30);
  --text:#f1f5f9; --text-2:#b4c0d3; --text-3:#8a99b0;
  --cyan:#22d3ee; --cyan-deep:#0891b2; --gold:#f59e0b; --gold-soft:#fbbf24;
  --green:#34d399; --violet:#818cf8; --pink:#ff6ba0; --red:#f87171;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --container:1120px; --gutter:20px; --nav-h:64px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text-2);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;z-index:0}   /* particle background drawn by the page script */
a{color:inherit;text-decoration:none} button{font-family:inherit} img{max-width:100%}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* ---- top bar ---- */
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:var(--nav-h);
  padding:8px max(var(--gutter),calc((100vw - var(--container))/2 + var(--gutter)));
  background:rgba(5,8,20,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-logo{display:flex;align-items:center;gap:10px;cursor:pointer}
.nav-logo img{width:36px;height:36px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(34,211,238,.35))}
.nav-logo-text,.logo-text{line-height:1.05}
.nav-logo-text .the,.logo-text .the{display:block;font-size:9px;font-weight:600;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.nav-logo-text .main,.logo-text .main{display:block;font-size:16px;font-weight:800;letter-spacing:.06em;color:#fff}
.nav-logo-text .cat,.logo-text .cat,.logo-text .catalyst{display:block;font-size:10px;font-weight:600;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase}
.nav-right{display:flex;align-items:center;gap:10px}
.nav-btn,.nav-back{min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s}
.nav-btn:hover,.nav-back:hover{border-color:var(--line-cyan);background:rgba(34,211,238,.08);color:var(--cyan)}

/* ---- primary buttons ---- */
.btn,.btn-primary,.enroll-btn,.save-btn,.submit-btn,.gate-btn,.mobile-enroll,.browse-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border:0;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--cyan),var(--cyan-deep));color:#031018;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 6px 22px rgba(34,211,238,.22);transition:transform .2s,box-shadow .2s}
.btn:hover,.btn-primary:hover,.enroll-btn:hover,.save-btn:hover,.submit-btn:hover,.gate-btn:hover,.mobile-enroll:hover,.browse-btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(34,211,238,.35)}
.enroll-btn.owned{background:rgba(52,211,153,.1);color:var(--green);border:1px solid rgba(52,211,153,.3);box-shadow:none;cursor:default}
.enroll-btn.owned:hover{transform:none}

/* ---- form fields ---- */
.field,.m-field{margin-bottom:var(--s4)}
.field label,.m-field label{display:block;margin-bottom:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.field input,.field select,.field textarea,.m-field input,.m-field select,.m-field textarea,.gate-input,.search-box,.price-input{
  width:100%;min-height:46px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(10,16,34,.9);
  color:var(--text);font:inherit;font-size:16px;outline:none;resize:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder,.field textarea::placeholder,.m-field input::placeholder,.m-field textarea::placeholder,.gate-input::placeholder{color:var(--text-3);opacity:.6}
.field input:focus,.field select:focus,.field textarea:focus,.m-field input:focus,.m-field select:focus,.m-field textarea:focus,.gate-input:focus,.search-box:focus,.price-input:focus{border-color:var(--line-cyan);box-shadow:0 0 0 3px rgba(34,211,238,.10)}
.field select option,.m-field select option{background:#0a1024}

/* ---- cards ---- */
.section-card,.profile-card,.sidebar-card,.summary-card,.chapter,.course-card,.stat-card,.table-wrap,.course-admin-card,.enrolled-course,.gate-card,.success-box{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}

/* ---- pop-up window ---- */
.modal-overlay{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.82);backdrop-filter:blur(6px)}
.modal-overlay.open{display:flex}
.modal-box{width:100%;max-width:500px;max-height:100%;overflow:hidden;border-radius:var(--r-lg);background:#0a1024;border:1px solid var(--line-cyan);box-shadow:0 0 80px rgba(34,211,238,.10)}
.modal-close{flex-shrink:0;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text-2);font-size:15px;cursor:pointer;transition:.2s}
.modal-close:hover{background:rgba(34,211,238,.12);color:#fff}

@media(max-width:640px){:root{--gutter:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ PROFILE PAGE ============ */
.page{position:relative;z-index:2;max-width:1040px;margin:0 auto;padding:var(--s6) var(--gutter) var(--s8);display:grid;grid-template-columns:290px 1fr;gap:var(--s5);align-items:start}
.profile-sidebar{position:sticky;top:84px;display:flex;flex-direction:column;gap:var(--s3)}
.profile-card{padding:var(--s5);text-align:center}
.avatar{width:76px;height:76px;margin:0 auto var(--s4);display:grid;place-items:center;border-radius:50%;font-size:28px;font-weight:800;color:var(--cyan);text-transform:uppercase;background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(245,158,11,.2));border:2px solid var(--line-cyan)}
.profile-name{margin-bottom:2px;font-size:18px;font-weight:700;color:var(--text)}
.profile-email{margin-bottom:var(--s4);font-size:13px;color:var(--text-3);word-break:break-all}
.profile-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:var(--s4)}
.profile-tag{padding:3px 10px;border-radius:var(--r-pill);font-size:12px;color:var(--cyan);background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.2)}
.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-stat{padding:12px;border-radius:12px;background:rgba(5,8,20,.6);border:1px solid var(--line)}
.p-stat .val{font-size:24px;font-weight:800;color:var(--gold)} .p-stat .lbl{font-size:12px;color:var(--text-3)}
.side-nav-links{display:flex;flex-direction:column;gap:2px}
.side-link{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid transparent;font-size:15px;font-weight:500;color:var(--text-2);cursor:pointer;transition:.15s}
.side-link:hover{background:rgba(34,211,238,.05);color:var(--text)}
.side-link.active{color:var(--cyan);background:rgba(34,211,238,.09);border-color:rgba(34,211,238,.2)}
.side-link-icon{width:20px;text-align:center}
.profile-content{min-width:0}
.section{display:none} .section.active{display:block}   /* the 4 switchable panels */
.section-card{padding:var(--s5);margin-bottom:var(--s4)}
.card-title{display:flex;align-items:center;gap:8px;margin-bottom:var(--s5);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2)}
.field input:disabled{color:var(--text-3);opacity:.6;cursor:not-allowed}
.field-note{margin-top:6px;font-size:12px;color:var(--text-3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.save-confirm{margin-left:var(--s3);font-size:14px;color:var(--green);opacity:0;transition:opacity .3s}
.save-confirm.show{opacity:1}
/* enrolled courses + progress */
.enrolled-course{padding:18px 20px;margin-bottom:var(--s3);border-radius:var(--r-md);background:rgba(5,8,20,.5);transition:border-color .2s}
.enrolled-course:hover{border-color:var(--line-cyan)}
.ec-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.ec-info{flex:1;min-width:0}
.ec-tag{display:inline-block;margin-bottom:6px;padding:2px 9px;border-radius:var(--r-pill);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ec-title{margin-bottom:3px;font-size:17px;font-weight:700;color:var(--text)}
.ec-meta{font-size:13px;color:var(--text-3)}
.go-btn{flex-shrink:0;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line-cyan);background:rgba(34,211,238,.08);color:var(--cyan);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s}
.go-btn:hover{background:rgba(34,211,238,.16)}
.progress-header{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-label{font-size:13px;color:var(--text-3)} .progress-pct{font-size:13px;font-weight:700;color:var(--cyan)}
.progress-bar-bg{width:100%;height:8px;margin-bottom:10px;border-radius:4px;background:rgba(34,211,238,.10);overflow:hidden}
.progress-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--cyan-deep));transition:width .6s ease}
.video-checklist{display:none;margin-top:10px} .video-checklist.open{display:block}
.chapter-group{margin-bottom:var(--s3)}
.chapter-group-title{margin-bottom:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.video-check-item{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 10px;border-radius:10px;cursor:pointer;transition:background .15s}
.video-check-item:hover{background:rgba(34,211,238,.05)}
.check-box{flex-shrink:0;width:20px;height:20px;display:grid;place-items:center;border-radius:6px;border:1.5px solid rgba(34,211,238,.3);font-size:12px;transition:.15s}
.check-box.checked{background:rgba(52,211,153,.16);border-color:var(--green);color:var(--green)}
.video-check-title{flex:1;font-size:14px;color:var(--text-2)}
.video-check-title.checked{color:var(--text-3);text-decoration:line-through}
.video-check-dur{font-size:12px;color:var(--text-3)}
.toggle-checklist{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:6px 0;background:none;border:0;font-size:13px;color:var(--text-3);cursor:pointer;transition:color .15s}
.toggle-checklist:hover{color:var(--cyan)}
/* history */
.history-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:14px 0;border-bottom:1px solid var(--line)}
.history-row:last-child{border-bottom:0}
.history-course{margin-bottom:2px;font-size:15px;font-weight:600;color:var(--text)}
.history-date{font-size:13px;color:var(--text-3)}
.history-amount{font-size:17px;font-weight:800;color:var(--gold);white-space:nowrap}
.history-amount.tbd{font-size:13px;font-weight:500;color:var(--text-3)}
.history-status{padding:3px 10px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;background:rgba(52,211,153,.10);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.empty-state{padding:48px 0;text-align:center;color:var(--text-3)}
.empty-state .e-icon{margin-bottom:var(--s3);font-size:40px}
.empty-state .browse-btn{margin-top:var(--s4)}
@media(max-width:860px){
  .page{grid-template-columns:1fr}
  .profile-sidebar{position:static}
  .side-nav-links{flex-direction:row;gap:6px;overflow-x:auto}   /* menu becomes a swipeable row */
  .side-link{white-space:nowrap}
  .row2{grid-template-columns:1fr}
  .ec-top{flex-direction:column}
}

/* ============ SHARED NAV (Home · Courses · Profile · Sign out) ============
   Uses the shared `nav` rule and the .nav-logo rules that every page already has.
   The old .nav-right / .nav-btn / .nav-back / .nav-user rules are no longer used.
================================================================ */
.mc-links{display:flex;align-items:center;gap:4px;min-width:0;overflow-x:auto}
.mc-link{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:12px;border:1px solid transparent;background:none;
  font:inherit;font-size:14px;font-weight:600;color:var(--text-2);white-space:nowrap;cursor:pointer;transition:.2s}
.mc-link:hover{color:var(--text);background:rgba(255,255,255,.06)}
.mc-link.active{color:var(--cyan);background:rgba(34,211,238,.10);border-color:rgba(34,211,238,.22)}
.mc-signout{margin-left:6px;border-color:var(--line);color:var(--text-3)}
.mc-signout:hover{color:var(--red);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
@media(max-width:640px){
  nav{gap:8px}
  nav .nav-logo-text{display:none}          /* phones: logo icon only, so all 4 links fit */
  .mc-link{padding:0 10px;font-size:13px}
  .mc-signout{margin-left:2px}
}
@media(max-width:360px){.mc-link{padding:0 8px;font-size:12.5px}}
@media(max-width:340px){.mc-link{padding:0 6px;font-size:12px}}
</style>
</head>

<nav>
  <a class="nav-logo" href="home.html">
    <img src="logo.png" alt="The Math Catalyst" />
    <div class="nav-logo-text">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script type="module">
/* ══════════════════════════════════════════════════
   LOAD STUDENT DATA FROM SUPABASE
═══════════════════════════════════════════════════ */
const { data: { session } } = await sb.auth.getSession();
if (!session) { location.href = 'login.html'; throw new Error('Not logged in'); }
const user = session.user;

function esc(v) {      // escape text before it goes into HTML
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

const { data: prof } = await sb.from('profiles').select('full_name,class_level,school').eq('id', user.id).maybeSingle();
const student = {
  name:   (prof && prof.full_name) || '—',
  email:  user.email,
  class:  (prof && prof.class_level) || '',
  school: (prof && prof.school) || '',
};

/* all of this student's enrollment requests */
const { data: enrRows } = await sb.from('enrollments')
  .select('id,course_id,status,amount,created_at,reviewed_at,courses(title)')
  .eq('user_id', user.id)
  .order('created_at', { ascending: false });
const enrollments = enrRows || [];

/* approved courses, with their chapters + videos */
const enrolledCourses = [];
for (const e of enrollments.filter(x => x.status === 'approved')) {
  const c = await fetchCourse(e.course_id);
  if (!c) continue;
  enrolledCourses.push({
    id: c.id, title: c.title, tag: c.tag,
    tagColor: c.tagColor, tagBg: c.tagBg,
    purchasedDate: fmtDate(e.reviewed_at || e.created_at),
    chapters: c.chapters.map(ch => ({
      name: ch.name,
      videos: ch.videos.map(v => ({ id: v.id, t: v.title, d: v.duration || '' }))
    }))
  });
}

const enrollmentHistory = enrollments.map(e => ({
  course: (e.courses && e.courses.title) || 'Course',
  date: fmtDate(e.created_at),
  amount: e.amount,
  status: { approved: 'Active', pending: 'Pending', rejected: 'Rejected', revoked: 'Cancelled' }[e.status] || e.status,
  color:  { approved: '', pending: '#f59e0b', rejected: '#f87171', revoked: '#f87171' }[e.status] || ''
}));

/* watched videos (set of video ids, as strings) */
const { data: wpRows } = await sb.from('watch_progress').select('video_id').eq('user_id', user.id).eq('watched', true);
const watchedSet = new Set((wpRows || []).map(r => String(r.video_id)));

/* ── helpers ── */
function courseStats(c) {
  const total = c.chapters.reduce((s, ch) => s + ch.videos.length, 0);
  const watched = c.chapters.reduce((s, ch) => s + ch.videos.filter(v => watchedSet.has(String(v.id))).length, 0);
  return { total, watched, pct: total ? Math.round(watched / total * 100) : 0 };
}
function totalWatchedAll() {
  return enrolledCourses.reduce((s, c) => s + courseStats(c).watched, 0);
}

/* ── init ── */
function init() {
  document.getElementById('avatar-initials').textContent = student.name.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();
  document.getElementById('sidebar-name').textContent = student.name;
  document.getElementById('sidebar-email').textContent = student.email;

  const tags = document.getElementById('sidebar-tags');
  tags.innerHTML =
    (student.class ? `<span class="profile-tag">${esc(student.class)}</span>` : '') +
    (student.school ? `<span class="profile-tag">${esc(student.school.split(' ')[0])}</span>` : '');

  document.getElementById('stat-courses').textContent = enrolledCourses.length;
  document.getElementById('stat-videos').textContent = totalWatchedAll();

  document.getElementById('f-name').value   = student.name === '—' ? '' : student.name;
  document.getElementById('f-email').value  = student.email;
  document.getElementById('f-class').value  = student.class;
  document.getElementById('f-school').value = student.school;

  renderCourses();
  renderHistory();
}

/* ── section switching ── */
function showSection(name, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.side-link').forEach(s => s.classList.remove('active'));
  document.getElementById('section-' + name).classList.add('active');
  el.classList.add('active');
}

/* ── RENDER ENROLLED COURSES ── */
function renderCourses() {
  const list = document.getElementById('enrolled-list');
  if (!enrolledCourses.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="e-icon">📭</div>
        <p>You haven't enrolled in any courses yet.</p>
        <button class="browse-btn" onclick="location.href='courses.html'">Browse courses</button>
      </div>`;
    return;
  }

  list.innerHTML = enrolledCourses.map(c => {
    const { total, watched, pct } = courseStats(c);
    const checklistId = `checklist-${c.id}`;
    const chaptersHtml = c.chapters.map(ch => `
      <div class="chapter-group">
        <div class="chapter-group-title">${esc(ch.name)}</div>
        ${ch.videos.map(v => {
          const key = String(v.id);
          const checked = watchedSet.has(key);
          return `
            <div class="video-check-item" onclick="toggleWatch('${key}', '${c.id}')">
              <div class="check-box ${checked ? 'checked' : ''}" id="cb-${key}">${checked ? '✓' : ''}</div>
              <span class="video-check-title ${checked ? 'checked' : ''}" id="ct-${key}">${esc(v.t)}</span>
              <span class="video-check-dur">${esc(v.d)}</span>
            </div>`;
        }).join('')}
      </div>`).join('');

    return `
      <div class="enrolled-course">
        <div class="ec-top">
          <div class="ec-info">
            <span class="ec-tag" style="background:${c.tagBg};color:${c.tagColor};border:1px solid ${c.tagColor}33">${esc(c.tag)}</span>
            <div class="ec-title">${esc(c.title)}</div>
            <div class="ec-meta" id="meta-${c.id}">Enrolled ${esc(c.purchasedDate)} · ${total} videos · ${watched} watched</div>
          </div>
          <button class="go-btn" onclick="location.href='course.html?id=${c.id}'">Go to course →</button>
        </div>
        <div class="progress-section">
          <div class="progress-header">
            <span class="progress-label">Progress</span>
            <span class="progress-pct" id="pct-${c.id}">${pct}%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="bar-${c.id}" style="width:${pct}%"></div>
          </div>
          <button class="toggle-checklist" id="tc-${c.id}" onclick="toggleChecklist('${checklistId}', this)">
            ▶ Show video checklist (${watched}/${total} watched)
          </button>
          <div class="video-checklist" id="${checklistId}">
            ${chaptersHtml}
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggleChecklist(id, btn) {
  const el = document.getElementById(id);
  const open = el.classList.toggle('open');
  const c = enrolledCourses.find(x => 'checklist-' + x.id === id);
  const { total, watched } = c ? courseStats(c) : { total: 0, watched: 0 };
  btn.textContent = (open ? '▼' : '▶') + ` ${open ? 'Hide' : 'Show'} video checklist (${watched}/${total} watched)`;
}

/* update every number/bar for one course after a checkbox changes */
function refreshProgress(courseId) {
  const c = enrolledCourses.find(x => String(x.id) === String(courseId));
  if (!c) return;
  const { total, watched, pct } = courseStats(c);
  const bar = document.getElementById('bar-' + courseId);
  const pctEl = document.getElementById('pct-' + courseId);
  const meta = document.getElementById('meta-' + courseId);
  const tc = document.getElementById('tc-' + courseId);
  const open = document.getElementById('checklist-' + courseId).classList.contains('open');
  if (bar) bar.style.width = pct + '%';
  if (pctEl) pctEl.textContent = pct + '%';
  if (meta) meta.textContent = `Enrolled ${c.purchasedDate} · ${total} videos · ${watched} watched`;
  if (tc) tc.textContent = (open ? '▼' : '▶') + ` ${open ? 'Hide' : 'Show'} video checklist (${watched}/${total} watched)`;
  document.getElementById('stat-videos').textContent = totalWatchedAll();
}

function paintCheckbox(key) {
  const cb = document.getElementById('cb-' + key);
  const ct = document.getElementById('ct-' + key);
  const watched = watchedSet.has(key);
  if (cb) { cb.classList.toggle('checked', watched); cb.textContent = watched ? '✓' : ''; }
  if (ct) ct.classList.toggle('checked', watched);
}

async function toggleWatch(key, courseId) {
  const nowWatched = !watchedSet.has(key);
  if (nowWatched) watchedSet.add(key); else watchedSet.delete(key);
  paintCheckbox(key);
  refreshProgress(courseId);

  const videoId = Number(key);
  const { error } = nowWatched
    ? await sb.from('watch_progress').upsert({ user_id: user.id, video_id: videoId, watched: true })
    : await sb.from('watch_progress').delete().eq('user_id', user.id).eq('video_id', videoId);

  if (error) {            // undo on failure
    if (nowWatched) watchedSet.delete(key); else watchedSet.add(key);
    paintCheckbox(key);
    refreshProgress(courseId);
    alert('Could not save progress: ' + error.message);
  }
}

/* ── RENDER HISTORY ── */
function renderHistory() {
  const list = document.getElementById('history-list');
  if (!enrollmentHistory.length) {
    list.innerHTML = '<div class="empty-state"><div class="e-icon">🧾</div><p>No enrollment history yet.</p></div>';
    return;
  }
  list.innerHTML = enrollmentHistory.map(x => `
    <div class="history-row">
      <div>
        <div class="history-course">${esc(x.course)}</div>
        <div class="history-date">${esc(x.date)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        ${x.amount
          ? `<span class="history-amount">৳${esc(x.amount)}</span>`
          : `<span class="history-amount tbd">Price TBD</span>`}
        <span class="history-status" ${x.color ? `style="color:${x.color}"` : ''}>${esc(x.status)}</span>
      </div>
    </div>
  `).join('');
}

/* ── SAVE SETTINGS ── */
async function saveSettings() {
  const name   = document.getElementById('f-name').value.trim();
  const cls    = document.getElementById('f-class').value;
  const school = document.getElementById('f-school').value.trim();
  if (!name) { alert('Please enter your name.'); return; }

  const { error } = await sb.from('profiles')
    .update({ full_name: name, class_level: cls, school })
    .eq('id', user.id);
  if (error) { alert('Could not save: ' + error.message); return; }

  student.name = name; student.class = cls; student.school = school;
  init();                       // refresh sidebar

  const confirmEl = document.getElementById('settings-confirm');
  confirmEl.classList.add('show');
  setTimeout(() => confirmEl.classList.remove('show'), 2500);
}

/* ── CHANGE PASSWORD ── */
async function changePassword() {
  const cur = document.getElementById('pw-current').value;
  const nw  = document.getElementById('pw-new').value;
  const cf  = document.getElementById('pw-confirm').value;

  if (!cur || !nw || !cf) { showPwMsg('Please fill in all fields.', '#f87171'); return; }
  if (nw.length < 8)      { showPwMsg('Password must be at least 8 characters.', '#f87171'); return; }
  if (nw !== cf)          { showPwMsg("Passwords don't match.", '#f87171'); return; }

  // check the current password first
  const check = await sb.auth.signInWithPassword({ email: user.email, password: cur });
  if (check.error) { showPwMsg('Current password is wrong.', '#f87171'); return; }

  const { error } = await sb.auth.updateUser({ password: nw });
  if (error) { showPwMsg(error.message, '#f87171'); return; }

  document.getElementById('pw-current').value = '';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-confirm').value = '';
  showPwMsg('✓ Password updated!', '#34d399');
}

function showPwMsg(text, color) {
  const msg = document.getElementById('pw-confirm-msg');
  msg.textContent = text;
  msg.style.color = color;
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 3000);
}

init();

/* ── ambient particles ── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
let mouse = {x:w/2,y:h/2}, ripples=[], t=0;
document.addEventListener('mousemove', e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
document.addEventListener('click', e=>{for(let i=0;i<3;i++) ripples.push({x:e.clientX,y:e.clientY,r:i*15,speed:1.8+i*0.4});});
document.addEventListener('touchmove', e=>{const t=e.touches[0];mouse.x=t.clientX;mouse.y=t.clientY;},{passive:true});
document.addEventListener('touchstart', e=>{const touch=e.touches[0];mouse.x=touch.clientX;mouse.y=touch.clientY;for(let i=0;i<3;i++) ripples.push({x:touch.clientX,y:touch.clientY,r:i*15,speed:1.8+i*0.4});},{passive:true});
function draw(){
  ctx.fillStyle='rgba(5,8,20,0.13)';ctx.fillRect(0,0,w,h);t+=0.003;
  const step=28;
  for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step){
    const dx=x-mouse.x,dy=y-mouse.y,dist=Math.sqrt(dx*dx+dy*dy);
    const wave=Math.sin(dist*0.018-t*5),influence=Math.max(0,1-dist/380);
    let ox=Math.sin(t+y*0.009)*7,oy=Math.cos(t+x*0.009)*7;
    for(const r of ripples){const rx=x-r.x,ry=y-r.y,d=Math.sqrt(rx*rx+ry*ry),rw=Math.sin(d*0.045-r.r*0.18),rf=Math.max(0,1-d/280);ox+=rw*rf*10;oy+=rw*rf*10;}
    const cr=x/w,rv=Math.round(34+cr*(245-34)),gv=Math.round(211+cr*(158-211)),bv=Math.round(238+cr*(11-238));
    ctx.fillStyle=`rgba(${rv},${gv},${bv},${0.03+wave*0.04+influence*0.1})`;
    ctx.fillRect(x+ox+wave*9,y+oy+wave*9,2,2);
  }
  ripples.forEach(r=>r.r+=r.speed);ripples=ripples.filter(r=>r.r<140);
  requestAnimationFrame(draw);
}
draw();

/* module scripts keep functions private, so expose the ones used by onclick="" */
Object.assign(window, { showSection, toggleChecklist, toggleWatch, saveSettings, changePassword });
</script>
